<!--
  BRAINMAP 2d-ii — standalone, hand-authored page (NOT build_index-managed;
  touches none of the index pins). Fetches GET /api/brainmap (the newest
  brainmap_graph row) and renders the 유통/연결 (spread/connection) graph on a
  single canvas. VERDICT-ISOLATED: this page shows NO verdict — cluster labels
  render the stored "N개 매체 보도 중" (spread) verbatim; a node click links
  BACK to its verification card (/?result_id=N) where verification lives.
  Self-contained: inline CSS + JS, no external lib/CDN.
-->
<style>
  /* BRAINMAP-COHESION: tokens mirrored from the main site's design system
     (frontend/styles/main.css :root) so this standalone page reads as tickedin.
     Values copied, not linked — the page stays self-contained (no CDN). */
  /* BRAINMAP-ATMOSPHERE: this page moves to a dark canvas so the domain
     colours read as points of light. Tokens are PAGE-LOCAL (copied, never
     linked) — the home page keeps its light, restrained treatment untouched.
     Encodings: x/y = embedding location refined by the 79-APPLY cluster pass
     (same-cluster attraction + equal-strength centroid separation — see
     refineLayout2D), colour = domain. Node size encodes nothing (77-APPLY
     jitter band). Only the atmosphere changes. */
  :root {
    /* 66-APPLY: synced to the design system's DARK-FIELD companions
       (main.css --dark-field / --df-*) — the map stays dark, but on the
       system's warm dark field instead of the cool navy. --paper and --line
       have no dark tokens in the system: they are derived one tone off the
       field (04's elevation-by-tone rule) and disclosed here. */
    color-scheme: dark;      /* native form controls (select) match the page */
    --ink: #eceae4;          /* df-text (12.9:1 on the field) */
    --slate: #b9beb8;        /* df-meta (7.6:1) */
    --muted: #b9beb8;        /* collapsed into df-meta — no third dark step exists */
    --line: #2e333b;         /* derived dark hairline (one tone above the field) */
    --paper: #1e232b;        /* derived L1 surface (one tone above the field) */
    --canvas: #161a21;       /* the system's dark field */
    --brand: #a9c0ec;        /* df-link */
    --brand-ink: #8fa5d4;    /* df-node — hover / active */
    --shadow: 0 8px 24px rgba(2, 6, 16, 0.55);
    --radius-sm: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    /* Site body font stack (Pretendard on the main site; graceful Korean
       system fallbacks here — no CDN font load on this standalone page). */
    font-family: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column;
  }
  /* 76-APPLY §02 — masthead, 56px: identity only (mark, 연결지도, ← 홈으로).
     Nothing operational lives here, so the map starts sooner. The wordmark
     wears the §07 tally mark + T2 sans wordmark (78-APPLY); this row is a
     separate decision, not taken here. */
  header.map-head {
    height: 56px; flex: 0 0 auto;
    display: flex; align-items: center; gap: 13px;
    padding: 0 22px;
    background: rgba(10, 15, 23, 0.9);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    position: relative; z-index: 6;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    color: #F2F5FA; text-decoration: none;
    /* 78-APPLY §07 T2: system sans 650, -0.01em (was Noto Serif KR 700).
       Same mark, same wordmark, both rooms. */
    font-family: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    font-size: 19px; font-weight: 650; letter-spacing: -0.01em;
  }
  .brand img { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: middle; }
  .brand-page-label {
    color: #9AA6B8; font-size: 12.5px; font-weight: 600;
    padding-left: 13px; border-left: 1px solid rgba(255, 255, 255, 0.14);
  }
  .map-home {
    margin-left: auto; font-size: 13px; font-weight: 600;
    color: var(--brand-ink); text-decoration: none;
  }
  .map-home:hover { text-decoration: underline; }
  /* §02: title over the canvas — the first fixation point; the honesty
     refusal is crossed before any node is read. Text-shadow instead of a
     plate keeps the chrome weightless; bold only on the shipped strongs. */
  .field-title { position: absolute; left: 20px; top: 18px; max-width: 640px; z-index: 4; pointer-events: none; }
  /* 75-APPLY §01 — the controls, as instruments. One left rail replaces the
     three stacked header rows. Glass, never solid (rgba(13,18,28,0.72) + 14px
     blur): the corpus stays visible through every panel. Accent #7AA2FF marks
     INTERACTIVE STATE only, never data — domain colour appears in the rail
     only as the legend dots. The rail deliberately has NO collapse toggle
     (a new hide-click would bury shipped controls); on short viewports it
     scrolls internally instead. */
  .rail {
    /* §02: top 118 clears the over-canvas title + honesty line; the bottom
       clearance keeps the stats gauge visible beneath the rail. */
    position: absolute; left: 20px; top: 118px; width: 312px;
    max-height: calc(100% - 176px); overflow: auto; z-index: 5;
    display: flex; flex-direction: column; gap: 10px; padding: 14px;
    border-radius: 12px; background: rgba(13, 18, 28, 0.72);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }
  .rail-div { height: 1px; background: rgba(255, 255, 255, 0.07); flex: none; }
  /* 77-APPLY C: the rail's internal scrollbar joins the dark system. Thin and
     low-key but VISIBLE — a scrolling panel must keep its affordance, so the
     thumb stays painted (no auto-hide, no transparent thumb).
     78-APPLY D: lowered again (0.25 → 0.15 thumb, 0.38 → 0.28 hover) — it
     still read as a light line against the field. ~1.9:1 against the rail
     glass keeps the affordance without a bright seam. */
  .rail { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.15) transparent; }
  .rail::-webkit-scrollbar { width: 8px; }
  .rail::-webkit-scrollbar-track { background: transparent; }
  .rail::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15); border-radius: 4px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  .rail::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); background-clip: padding-box; border: 2px solid transparent; }
  /* Search leads the rail: the only free-text instrument. */
  .map-search {
    width: 100%; height: 34px; padding: 0 12px; border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.10); background: rgba(255, 255, 255, 0.05);
    color: #EDF1F7; font-size: 13px; outline: none; font-family: inherit;
  }
  .map-search:focus { border-color: #7AA2FF; box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.18); }
  .search-count { font-size: 12px; color: #8E99AB; padding: 0 2px; }
  .search-count:empty { display: none; }
  /* 확산 규모 as a 4-stop ladder: a threshold is one value on an ordered
     scale; stops on a track show the whole range a dropdown hides. Every stop
     label is the shipped <option> string verbatim. */
  .spread-head { display: flex; align-items: baseline; gap: 6px; padding: 0 2px; font-size: 12.5px; }
  .spread-head .lbl { color: #8E99AB; }
  .spread-head .val { color: #EDF1F7; font-weight: 650; }
  .spread { position: relative; margin-top: 6px; }
  .spread .track { position: absolute; left: 7.5px; top: 14px; bottom: 14px; width: 1px; background: rgba(255, 255, 255, 0.12); }
  .stop {
    position: relative; display: flex; align-items: center; gap: 10px;
    height: 26px; width: 100%; cursor: pointer; background: transparent;
    border: 0; padding: 0; margin: 0; font-family: inherit; text-align: left;
    border-radius: 6px; font-size: 12.5px; color: #A6B1C4;
  }
  .stop:hover { background: rgba(255, 255, 255, 0.04); }
  .stop:focus-visible { outline: 2px solid #7AA2FF; outline-offset: 1px; }
  .stop .pip {
    width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box;
    border: 1.5px solid rgba(255, 255, 255, 0.28); background: #0D131F;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .stop[aria-checked="true"] { color: #EDF1F7; font-weight: 650; }
  .stop[aria-checked="true"] .pip { border-color: #7AA2FF; }
  .stop[aria-checked="true"] .pip::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #7AA2FF; }
  /* ‹ › paging + 리셋 dock top-right — the corner opposite filter-building, so
     a trackpad overshoot cannot wreck a built-up state. 리셋 is the screen's
     only filled button: one recovery affordance, always findable. */
  .map-actions {
    position: absolute; right: 20px; top: 16px; z-index: 5;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 8px; flex-wrap: wrap;
  }
  .search-nav { display: none; align-items: center; gap: 8px; }
  .nav-step {
    width: 32px; height: 32px; min-width: 32px; padding: 0;
    border-radius: 8px; background: rgba(13, 18, 28, 0.72);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    display: flex; align-items: center; justify-content: center;
    color: #C6CFDD; font-size: 16px; line-height: 1; cursor: pointer;
    font-family: inherit;
  }
  .nav-step:hover:not([disabled]) { background: rgba(122, 162, 255, 0.12); }
  .nav-step:focus-visible { outline: 2px solid #7AA2FF; outline-offset: 1px; }
  /* Disabled reads as a dimmer INK, never a lower opacity — opacity encodes
     nothing on this page and must keep encoding nothing. */
  .nav-step[disabled] { opacity: 1; color: #5F6B80; cursor: default; }
  .nav-pos {
    font-size: 12.5px; font-weight: 700; color: #D7E3FF;
    min-width: 60px; text-align: center; white-space: nowrap;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 3px rgba(6, 9, 15, 0.85);
  }
  /* The order is a FACT about the list, not a ranking — said out loud, next to
     the position, so "1 / 123" cannot be read as "the most relevant". */
  .nav-note { font-size: 11.5px; color: #8E99AB; white-space: nowrap; text-shadow: 0 1px 3px rgba(6, 9, 15, 0.85); }
  .act-div { width: 1px; height: 18px; background: rgba(255, 255, 255, 0.12); flex: none; }
  .map-reset {
    height: 32px; padding: 0 14px; border-radius: 8px;
    background: rgba(122, 162, 255, 0.16); border: 1px solid rgba(122, 162, 255, 0.45);
    display: flex; align-items: center; color: #D7E3FF;
    font-size: 12.5px; font-weight: 650; cursor: pointer; font-family: inherit;
  }
  .map-reset:hover { background: rgba(122, 162, 255, 0.24); }
  .map-reset:focus-visible { outline: 2px solid #7AA2FF; outline-offset: 1px; }
  /* 77-APPLY §05 empty state: when a filter combination matches nothing, the
     field ghosts and 리셋 — the one recovery affordance — breathes. Visual
     only: the spec's one-line "no result" sentence must be supplied, so no
     Korean is written here. Motion respects prefers-reduced-motion. */
  .map-reset.pulse { animation: omPulse 1.8s ease-in-out infinite; }
  @keyframes omPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(122, 162, 255, 0); }
    50% { box-shadow: 0 0 0 6px rgba(122, 162, 255, 0.22); }
  }
  @media (prefers-reduced-motion: reduce) { .map-reset.pulse { animation: none; } }
  /* 77-APPLY §05 loading: a 2px accent hairline runs under the masthead while
     the graph loads — instruments render before data; the shipped settle
     animation is the loading state. Removed once the payload arrives. */
  .load-bar { position: absolute; left: 0; right: 0; top: 0; height: 2px; overflow: hidden; z-index: 7; }
  .load-bar span { display: block; width: 38%; height: 100%; background: #7AA2FF; animation: omLoad 1.5s linear infinite; }
  @keyframes omLoad {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(360%); }
  }
  @media (prefers-reduced-motion: reduce) { .load-bar span { animation: none; width: 100%; opacity: 0.5; } }
  /* BRAINMAP-FOCUS: the focus chip shares 리셋's accent chrome, so an active
     focus is visible without inventing a new control language. Its transient
     note state (unclustered tap) drops to the plain glass chrome. */
  .map-focus[disabled] {
    background: rgba(13, 18, 28, 0.72); border-color: rgba(255, 255, 255, 0.09);
    color: #B9C3D4; cursor: default;
  }
  .map-title {
    display: block; margin: 0;
    font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: #EDF1F7;
    text-shadow: 0 1px 3px rgba(6, 9, 15, 0.8);
    /* FONT-SWITCH: page title joins the body sans stack; only .brand stays serif. */
    font-family: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  }
  /* HONESTY (fixed, always visible): this map is spread/connection, NOT verification. */
  .map-subtitle {
    margin: 7px 0 0; font-size: 13px; line-height: 1.65; color: #A9B4C7;
    text-shadow: 0 1px 3px rgba(6, 9, 15, 0.85);
  }
  .map-subtitle strong { color: #EDF1F7; font-weight: 700; }
  /* §02: stats bottom-left — a gauge, not a control, placed like a map's
     scale bar. Repositioned, never removed; tabular numerals, every zoom. */
  .map-stats {
    position: absolute; left: 20px; bottom: 16px; z-index: 4;
    padding: 7px 12px; border-radius: 8px;
    background: rgba(13, 18, 28, 0.72);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    font-size: 12px; color: #96A2B5; font-variant-numeric: tabular-nums;
    white-space: nowrap; max-width: calc(100% - 40px);
  }
  /* §02: the shipped 3D gesture instructions dock bottom-centre only while
     입체 보기 is on — where the hands are, not in the rail. */
  .mode-hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 4; padding: 7px 12px; border-radius: 8px;
    background: rgba(13, 18, 28, 0.72);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    font-size: 12px; color: #96A2B5; line-height: 1.5;
    max-width: 56%; text-align: center;
  }
  /* 75-APPLY §01: the rail's dynamic half — segmented scope pair, the domain
     list (key and switch in one: legend = filter), market rows, mode switches.
     BRAINMAP-FILTER semantics unchanged: same data-filter kinds, same
     delegated click handler, same mutual exclusions. */
  .legend { display: flex; flex-direction: column; gap: 10px; }
  .legend .key {
    display: flex; align-items: center; gap: 8px;
    height: 26px; padding: 0 8px; margin: 0; border: 0; border-radius: 6px;
    background: transparent; font-family: inherit; font-size: 12.5px;
    color: #B9C3D4; cursor: pointer; text-align: left; line-height: 1.15;
    transition: background .12s, color .12s; flex: none;
  }
  .legend .key:hover { background: rgba(255, 255, 255, 0.05); color: #C9D2E0; }
  .legend .key:focus-visible { outline: 2px solid #7AA2FF; outline-offset: 1px; }
  /* 전체 보기 | 분야 여러 개 고르기 — selection MODES, not filters, so they sit
     as a segmented pair above the list they govern. */
  .legend .seg {
    display: flex; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 7px;
    padding: 2px; gap: 2px;
  }
  .legend .seg .key {
    flex: 1; height: auto; display: block; text-align: center; padding: 0;
    line-height: 24px; font-size: 12px; border-radius: 5px; color: #A6B1C4;
  }
  .legend .seg .key:hover { background: rgba(255, 255, 255, 0.06); }
  .legend .seg .key.active {
    background: rgba(122, 162, 255, 0.16); color: #EDF1F7; font-weight: 650;
    box-shadow: inset 0 0 0 1px rgba(122, 162, 255, 0.35);
  }
  /* Domain list = legend: two columns, shipped corpus-volume order, all 13
     visible without scrolling. Active (solo) = accent wash + inset left bar —
     accent marks state, the dot keeps carrying the domain colour. */
  .legend .dgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 6px; }
  .legend .key.active {
    color: #EDF1F7; font-weight: 650; background: rgba(122, 162, 255, 0.10);
    box-shadow: inset 2px 0 0 #7AA2FF;
  }
  /* BRAINMAP-MULTI-DOMAIN: while 분야 여러 개 고르기 is on, each domain row
     shows a checkbox square — filled when the domain is in the selection, NO
     ✓ glyph (none anywhere in this product). The square only appears in
     multi-select mode, so a plain solo click keeps its shipped look. Never
     opacity (encodes nothing here), never size (encodes outlet count). */
  .legend .box {
    display: none; width: 12px; height: 12px; border-radius: 3px;
    border: 1.5px solid rgba(255, 255, 255, 0.30); box-sizing: border-box; flex: none;
  }
  .legend.multi-on .key[data-filter="domain"] .box { display: inline-block; }
  .legend.multi-on .key[data-filter="domain"].active {
    background: transparent; box-shadow: none; font-weight: 400; color: #EDF1F7;
  }
  .legend.multi-on .key[data-filter="domain"].active .box { background: #7AA2FF; border-color: #7AA2FF; }
  /* The row order is corpus volume, stated so the list cannot be read as a
     priority list. Same disclosure the search stepper makes. */
  .legend-note { font-size: 11.5px; color: #8E99AB; line-height: 1.5; padding: 0 8px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .legend .dot.hollow { background: transparent !important; border: 1.5px solid #8FA0B8; box-sizing: border-box; }
  /* 숨기기 / 집중 모드 / 입체 보기 are STATES, not picks — each renders its
     own switch position so the rail reads like a console at a glance. */
  .legend .key-switch { justify-content: space-between; gap: 10px; height: 28px; }
  .legend .key-switch .sw {
    width: 28px; height: 16px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.14); position: relative; flex: none;
    transition: background .12s;
  }
  .legend .key-switch .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 12px; height: 12px; border-radius: 50%; background: #8E99AB;
    transition: left .12s, background .12s;
  }
  .legend .key-switch.active { background: transparent; box-shadow: none; color: #EDF1F7; font-weight: 400; }
  .legend .key-switch.active .sw { background: rgba(122, 162, 255, 0.45); }
  .legend .key-switch.active .sw::after { left: 14px; background: #EDF1F7; }
  /* Touch: rows grow to a real tap target (padding/height only — no size or
     opacity encoding is involved, and the column order is unchanged). */
  @media (pointer: coarse) {
    .legend .key, .stop { height: 34px; }
    .legend .key-switch { height: 34px; }
  }
  /* Narrow phones: the rail cannot dock beside a 390px field, and it may not
     collapse (a hide-click would bury shipped controls). It spans the top of
     the field below the ‹›/리셋 corner, capped so over half the field stays
     visible, scrolling internally — same device the short-laptop rule uses. */
  @media (max-width: 600px) {
    .field-title { left: 12px; right: 76px; top: 14px; max-width: none; }
    .rail { left: 12px; right: 12px; width: auto; top: 148px; max-height: 38%; }
    .map-actions { right: 12px; top: 12px; max-width: calc(100% - 24px); }
    .map-stats { left: 12px; bottom: 12px; white-space: normal; max-width: calc(100% - 24px); }
  }
  main.map-body { position: relative; flex: 1 1 auto; min-height: 0; }
  /* MOBILE-POLISH H: touch-action:none is what lets the touch handlers below see a
     coherent gesture — the default (auto) hands one-finger drags and pinches to the
     browser as page scroll/zoom before any JS runs, so the graph could never pan or
     pinch on a phone. No effect on mouse input. */
  canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
  /* 76-APPLY §03 — tooltip: the light cards' geometry gone dark. Title
     13.5px/650, meta 12px; near-opaque glass + hairline so it reads over the
     busiest field; 14px cursor offset and edge flip live in onMove. */
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    max-width: 380px; padding: 11px 14px;
    background: rgba(10, 15, 23, 0.92); color: #F0F4FA;
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 6px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 13.5px; font-weight: 650; line-height: 1.5;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55); z-index: 6;
  }
  #tooltip .tip-spread {
    color: #9FABBE; margin-top: 5px; font-size: 12px; font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  #status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--slate); font-size: 15px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<header class="map-head">
  <!-- BRAINMAP-COHESION / 76-APPLY §02: identity-only masthead — the site's
       wordmark (tally mark + sans "tickedin", same treatment as the main
       header's .brand), the page label, the return link. Nothing operational. -->
  <a class="brand" href="/" aria-label="tickedin 홈으로"><img src="/web/assets/favicon-180.png" alt="" aria-hidden="true">tickedin</a>
  <span class="brand-page-label">연결지도</span>
  <a class="map-home" href="/">← 홈으로</a>
</header>
<main class="map-body">
  <canvas id="map"></canvas>
  <div id="loadBar" class="load-bar" aria-hidden="true"><span></span></div>
  <div id="status">지도를 불러오는 중…</div>
  <!-- 76-APPLY §02: title + honesty line over the canvas — the first fixation
       point. Shipped strings verbatim; pointer-events none, so the field
       beneath stays pannable. -->
  <div class="field-title">
    <span class="map-title">뉴스 연결지도</span>
    <p class="map-subtitle">
      이 지도는 뉴스의 <strong>유통·연결</strong>을 보여줍니다. <strong>검증이 아닙니다.</strong>

    </p>

  <!-- BRAINMAP-FEATURES: one-line numeric stats over the FULL loaded graph
       (not the filtered view) — circulation counts only. §02: bottom-left,
       like a map's scale bar. -->

  <!-- BRAINMAP-3D-VIEW / §02: gesture hint, bottom-centre, only while 입체
       보기 is on (updateModeHint owns visibility). -->

  <!-- 75-APPLY §01: the instrument rail, docked left over the field. Order is
       the reader's question order — which claim (search), how widely spread

       rail occludes ~312px of the centre-weighted cloud's cheapest margin and

  <div class="rail">
    <!-- BRAINMAP-FEATURES: keyword search (substring over node titles, dims

    <span id="searchCount" class="search-count" aria-live="polite"></span>

    <!-- BRAINMAP-FEATURES: the spread threshold (cluster outlet_count), as a
         4-stop ladder over the same 0/3/5/10 values the shipped <select>
         carried — every stop label is that select's option string verbatim

        <button type="button" class="stop" role="radio" aria-checked="false" data-spread="5"><span class="pip" aria-hidden="true"></span>5개 매체 이상 보도</button>
        <button type="button" class="stop" role="radio" aria-checked="false" data-spread="10"><span class="pip" aria-hidden="true"></span>10개 매체 이상 보도</button>
      </div>
    </div>
    <div class="rail-div"></div>

  </div>
  <!-- 75-APPLY §01: paging + recovery in the corner opposite filter-building.
       BRAINMAP-SEARCH-NAV: the stepper shows only while a query is active;
       "3 / 123" is a POSITION IN A LIST, never a rank — the note says so.
       BRAINMAP-FOCUS: the chip appears only while a cluster is focused (or
       the one-shot arm is waiting). -->
  <div class="map-actions">
    <span id="searchNav" class="search-nav" style="display:none">
      <button type="button" id="searchPrev" class="nav-step" aria-label="이전 일치 항목으로">‹</button>
      <span id="searchPos" class="nav-pos" aria-live="polite" aria-atomic="true"></span>
      <button type="button" id="searchNext" class="nav-step" aria-label="다음 일치 항목으로">›</button>

      <span class="act-div" aria-hidden="true"></span>
    </span>
    <button type="button" id="focusChip" class="map-reset map-focus" style="display:none"></button>
    <button type="button" id="resetView" class="map-reset">리셋</button>
  </div>
  <div id="tooltip"></div>
</main>
<script>
(function () {
  "use strict";

  // Fixed categorical palette per domain. BRAINMAP-ATMOSPHERE: the same HUE
  // per domain as the original light-bg palette, lifted in lightness so the
  // points read as lights on the dark canvas. The ENCODING (domain -> hue
  // family) is unchanged — only luminance moved with the background.
  var DOMAIN_COLORS = {
    "finance":      "#5aa2e8",
    "welfare":      "#e0a84a",
    "agriculture":  "#55c088",
    "labor":        "#cf8a3d",
    "health":       "#ef6a6a",
    "environment":  "#4fc0c2",
    "SMB":          "#a789ec",
    "realestate":   "#e86ab4",
    "statistics":   "#93a3ba",
    "education":    "#8b90ef",
    "scitech":      "#38b6d8",
    "trade":        "#e0578f",
    "기타-미분류":   "#8b97a8"
  };
  var DOMAIN_KO = {
    "finance": "금융", "welfare": "복지", "agriculture": "농어업",
    "labor": "고용·노동", "health": "보건", "environment": "환경",
    "SMB": "소상공인·중기", "realestate": "부동산", "statistics": "통계",
    "education": "교육",
    "scitech": "과학기술", "trade": "산업·통상",
    "기타-미분류": "기타"
  };
  var FALLBACK_COLOR = "#98a2b3";
  var PAD = 40;             // canvas margin (px)
  var HIT_RADIUS = 9;       // hover hit-test radius (px)
  var LABEL_TOP_N = 12;     // clusters drawn with an always-on label
  var LABEL_MIN_SIZE = 5;

  var canvas = document.getElementById("map");
  var ctx = canvas.getContext("2d");
  var tooltip = document.getElementById("tooltip");
  var statusEl = document.getElementById("status");

  var graph = null;         // {nodes, edges, clusters}
  var nodeById = {};        // id -> node
  var clusterById = {};     // cluster_id -> cluster meta
  var positions = [];       // per node: {px, py} in CSS pixels
  var labelSpots = [];      // top-cluster label placements
  // 76-APPLY §03 zoom ladder: centroid anchors for every OTHER cluster, drawn
  // only past the zoom thresholds (2.5x: 8+ outlets; 6x: every pair). The
  // base labelSpots pick above is untouched — zooming only ever ADDS.
  var extraLabelSpots = [];
  // Canvas labels use the page's own font stack (ctx.font accepts the list).
  var LABEL_STACK = "system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif";
  var hoverNode = null;

  // BRAINMAP-FILTER: client-side domain filter over the already-loaded nodes
  // (no new fetch, no data change).
  // BRAINMAP-MULTI-DOMAIN: the single {type,value} slot became a SET of domain
  // values, so 교육 and 복지 can be read together. Everything else about the
  // filter is unchanged — same client-side dimming, same AND chain, no fetch.
  //   domainSel  : selected domain values. EMPTY = no domain condition (every
  //                domain lit), which is the state 전체 보기 shows as active.
  //                Empty and all-twelve-selected produce the same lit set but
  //                are DIFFERENT STATES and are shown differently (see
  //                updateLegendActive): empty lights 전체 보기, all-twelve
  //                lights twelve ticked chips. Order is meaningless here — it
  //                is a set, never a ranking, and selected chips are never
  //                promoted or reordered in the legend.
  //   marketOnly : the 시장·시세 소식(빈 점) isolate. Kept MUTUALLY EXCLUSIVE
  //                with domainSel exactly as the old single slot was, so no
  //                existing combination changes meaning.
  //   multiSelectMode : an INPUT MODE, not a filter. While on, a plain tap
  //                toggles a domain instead of switching to it — the touch
  //                route to multi-select, mirroring the existing focus-arm
  //                chip (a phone has no Ctrl/⌘/Shift). Off by default, so a
  //                plain click keeps its current meaning byte for byte.
  var domainSel = [];
  var marketOnly = false;
  var multiSelectMode = false;
  // BRAINMAP-FEATURES: two ADDITIONAL client-side conditions that compose with
  // the domain filter via AND in isActive — a node stays lit only if it passes
  // ALL active conditions. Circulation-only (title match / cluster outlet
  // count); never verdict-based.
  var searchQuery = "";     // lowercased substring over node.title ("" = off)
  var spreadMin = 0;        // min cluster outlet_count (0 = off)
  var hasEdgeById = {};     // node id -> true when the node has >=1 edge
  // BRAINMAP-FOCUS: two more conditions on the SAME AND chain in isActive.
  // Neither adds a filtering path, a fetch, or a payload field — cluster_id
  // and content_nature are already on every node.
  //   focusCluster: a cluster_id whose constellation stays lit while the rest
  //     of the map dims. null = off.
  //   focusArmed: one-shot mode so a TAP can focus on touch, where there is no
  //     modifier key. Disarms itself after one focus so a plain tap goes back
  //     to opening the card — the mode can never get stuck on.
  //   hideMarket: hides 시장·시세 items (content_nature === market_commercial).
  var focusCluster = null;
  var focusArmed = false;
  var hideMarket = false;
  var focusNoteTimer = null;

  function anyFilterActive() {
    return domainSel.length > 0 || marketOnly || searchQuery !== "" || spreadMin > 0
      || focusCluster !== null || hideMarket;
  }

  // View transform (pan/zoom). Screen = world * scale + offset. Initial
  // {1, 0, 0} is byte-identical to the original static fit-to-viewport view.
  // `positions` / `labelSpots` remain the WORLD layer; this rides on top so
  // node radii, line widths, and label fonts stay constant in SCREEN pixels
  // at any zoom, and the hover hit test uses a constant screen-px radius.
  var view = { scale: 1, offsetX: 0, offsetY: 0 };

  // BRAINMAP-3D-VIEW: DISPOSABLE comparison mode (decision by 8/1; if 3D
  // loses it is deleted). Default is ALWAYS 2D — mode3d flips only via the
  // legend chip. The 3D pass projects the builder's x3/y3/z3 with an
  // ORTHOGRAPHIC camera (no perspective scaling: size = outlet count; no
  // depth fade: opacity encodes nothing). z is layout, never a variable.
  var mode3d = false;
  var has3d = false;          // payload carries x3/y3/z3 (older rows do not)
  var ROT0 = { yaw: -0.30, pitch: 0.22 };  // gentle initial tilt (unchanged)
  var drawOrder = null;       // far-to-near node order (3D only; null in 2D)
  var dragRotating = false;   // current drag is a rotation (3D, no pan modifier)

  // BRAINMAP-3D-DEPTH: depth-sorted paint buckets so EDGES interleave with
  // nodes instead of all being flushed underneath them. Node depth order was
  // already correct (drawOrder); edges were not — every edge drew behind every
  // node, so an edge passing in FRONT of a node looked like it passed behind.
  // Buckets (not a full per-primitive sort) keep the batched stroke: one
  // beginPath/stroke per bucket, far to near, with that bucket's nodes stamped
  // on top. STYLE/ORDER ONLY — every edge is still drawn, at one shared width
  // and alpha; ordering is geometry, not an encoding.
  var DEPTH_BUCKETS = 24;
  var bucketNodeStart = null; // Int32Array(DEPTH_BUCKETS+1): slices of drawOrder
  var bucketEdges = null;     // Array(DEPTH_BUCKETS) of edge-index arrays
  // 77-APPLY §04: per-node depth for the 3D distance fade / size attenuation.
  // Set by layout() in 3D, null in 2D. Presentation only — depth is layout,
  // never a measured value, and the fade is neutral (alpha only, hue fixed).
  var depth3d = null, depth3dMin = 0, depth3dSpan = 1;
  // BRAINMAP-3D-DEPTH (Part C): the cloud's own edge, as a WORLD-SPACE SPHERE
  // around the 3D centroid. Projected orthographically a sphere is always a
  // circle of the same radius, so this boundary is EXACTLY invariant under
  // rotation — no hull to recompute, no jitter. cloud3 is computed once from
  // x3/y3/z3; cloudProj is its projection into the `positions` (pre-view) layer.
  var cloud3 = null;          // {cx, cy, cz, r} in unit-cube units
  var cloudProj = null;       // {px, py, r} in the same space as `positions`
  // BRAINMAP-3D-DEPTH (Part A): the node the search last centred on, so the
  // search's CURRENT MATCH — not just its query text — survives a mode switch.
  var searchMatchIndex = null;
  // BRAINMAP-SEARCH-NAV: the ordered match list the ◀ ▶ stepper walks, and the
  // reader's place in it. searchMatches holds INDEXES INTO graph.nodes, in the
  // graph's own node order (analysis_results.id ascending) — an ingestion
  // order, arbitrary with respect to relevance, and never a ranking. It is
  // rebuilt from the fully composed isActive() predicate on every change, so
  // it can never contain a node the filters have dimmed.
  var searchMatches = [];
  var searchPos = -1;         // index into searchMatches; -1 = not on one yet

  // BRAINMAP-3D-CONTROLS: orientation is a 3x3 ROTATION MATRIX (row-major
  // flat 9), not Euler angles — an arcball produces arbitrary axes that
  // yaw/pitch cannot represent. `_mat3FromYawPitch` reproduces the previous
  // initial tilt EXACTLY, so the default 3D view is unchanged.
  function _mat3FromYawPitch(yaw, pitch) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    return [cy, 0, sy,
            sp * sy, cp, -sp * cy,
            -cp * sy, sp, cp * cy];
  }
  function _mat3Mul(a, b) {   // a * b
    var o = new Array(9);
    for (var r = 0; r < 3; r++) {
      for (var c = 0; c < 3; c++) {
        o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c];
      }
    }
    return o;
  }
  // Gram-Schmidt: float error over many drags would slowly shear the basis.
  // Applied only when a drag ENDS, so reversibility within a drag is exact.
  function _mat3Orthonormalize(m) {
    function nrm(v) {
      var l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1;
      return [v[0] / l, v[1] / l, v[2] / l];
    }
    var r0 = nrm([m[0], m[1], m[2]]);
    var d = m[3] * r0[0] + m[4] * r0[1] + m[5] * r0[2];
    var r1 = nrm([m[3] - d * r0[0], m[4] - d * r0[1], m[5] - d * r0[2]]);
    var r2 = [r0[1] * r1[2] - r0[2] * r1[1],
              r0[2] * r1[0] - r0[0] * r1[2],
              r0[0] * r1[1] - r0[1] * r1[0]];
    return [r0[0], r0[1], r0[2], r1[0], r1[1], r1[2], r2[0], r2[1], r2[2]];
  }
  var ROT0_M = _mat3FromYawPitch(ROT0.yaw, ROT0.pitch);
  var rotM = ROT0_M.slice();
  var arcStart = null;        // unit sphere vector at press
  var rotAtPress = null;      // orientation snapshot at press

  // Sphere-plus-hyperbolic-sheet mapping (Bell/Holroyd), replacing the plain
  // Shoemake clamp. WHY: the old mapping clamped anything at or beyond the
  // virtual sphere's rim to z=0, and a z=0 grab is a pure in-plane ROLL — the
  // behaviour reported as confusing. Worse, it made the rim a SECOND decision
  // boundary competing with the cloud's edge (Part C), so the same screen
  // position could tumble or roll depending on zoom.
  //   Inside r/sqrt(2): the sphere, byte-identical to before.
  //   Beyond it: a hyperbolic sheet z = (r^2/2)/d, which joins the sphere
  //   smoothly (both give z = r/sqrt(2) at the seam) and is STRICTLY POSITIVE
  //   everywhere. z never reaches 0, so no press anywhere on the canvas can
  //   degenerate into a roll, and the rim stops being a boundary at all — it
  //   is now only the sensitivity scale of one continuous mapping.
  function sphereVec(mx, my) {
    var rect = canvas.parentElement.getBoundingClientRect();
    var w = Math.max(320, rect.width), h = Math.max(280, rect.height);
    var radius = 0.45 * Math.min(w, h);
    var ux = (mx - w / 2) / radius, uy = (my - h / 2) / radius;
    var d2 = ux * ux + uy * uy;
    var z = (d2 <= 0.5) ? Math.sqrt(1 - d2) : 0.5 / Math.sqrt(d2);
    var len = Math.sqrt(d2 + z * z) || 1;
    return [ux / len, uy / len, z / len];
  }

  // Rotation taking unit vector a onto unit vector b, by the EXACT arc angle
  // (not Shoemake's doubled quaternion) so the grabbed point tracks the
  // cursor 1:1. Rodrigues; degenerate cases fall back cleanly.
  function rotBetween(a, b) {
    var vx = a[1] * b[2] - a[2] * b[1];
    var vy = a[2] * b[0] - a[0] * b[2];
    var vz = a[0] * b[1] - a[1] * b[0];
    var s2 = vx * vx + vy * vy + vz * vz;
    var c = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    if (s2 < 1e-12) {
      if (c > 0) return [1, 0, 0, 0, 1, 0, 0, 0, 1];   // same point: identity
      return [-1, 0, 0, 0, -1, 0, 0, 0, 1];            // antipodal: 180 deg roll
    }
    var k = (1 - c) / s2;
    return [c + vx * vx * k,      vx * vy * k - vz,     vx * vz * k + vy,
            vy * vx * k + vz,     c + vy * vy * k,      vy * vz * k - vx,
            vz * vx * k - vy,     vz * vy * k + vx,     c + vz * vz * k];
  }

  // BRAINMAP-DEPTH-STYLE: rendering constants. Coordinates NEVER move; only
  // how a node is painted changes.
  // 77-APPLY §04: node marks are uniform 1.3–2.4px — the variance is RANDOM
  // jitter (a stable per-node hash), never degree, never clustered-ness: an
  // 80-outlet cluster earns more dots, not bigger ones, and the unlinked 72%
  // render at the SAME sizes and the SAME alpha as connected nodes — the
  // singles are the corpus's honest shape, not a background layer. (This
  // retires the old 3.0/1.9 + 0.95/0.6 clustered/unclustered split, which
  // was a size+luminance encoding of exactly the kind the page forbids.)
  var R_JITTER_MIN = 1.3, R_JITTER_MAX = 2.4;
  var R_JITTER_STEPS = 12;  // quantised so the sprite cache stays small
  function jitterStep(i) {
    // Stable, meaning-free hash of the node's load index — same every frame,
    // uncorrelated with degree, domain, or anything measured.
    return ((i * 2654435761) >>> 16) % R_JITTER_STEPS;
  }
  function jitterRadius(step) {
    return R_JITTER_MIN + step * ((R_JITTER_MAX - R_JITTER_MIN) / (R_JITTER_STEPS - 1));
  }
  // LEGIBILITY: ring thinned 1.25 -> 0.5 and drawn INSET, so a node's
  // footprint is exactly its radius (was r+1.25 — a 1.9px node wore a
  // 3.15px footprint and read as a hollow donut). Uniform for every node.
  var RING_W = 0.5;         // separation ring in the page background colour
  var BG_COLOR = "#0b1220"; // must equal --canvas
  var spriteCache = {};     // (color|radius|hollow|dpr) -> prerendered sprite

  // BRAINMAP-3D-DEPTH (Part B1): in 3D, node radii grow with zoom so that
  // occlusion — the ONE depth cue left to us — becomes perceptible. Measured on
  // the live graph: at 4x zoom with today's 3px marks only 30.0% of on-screen
  // nodes are visibly clipped by a neighbour (it reads as a flat scatter); at
  // 6px that is 73.6% clipped while still only 1.0% fully hidden.
  //   UNIFORM: one factor multiplies EVERY node's radius, so the jitter
  //   band keeps its exact proportions. Nothing per-node varies with data.
  //   Floor 1: zooming OUT never shrinks a node, so the overview is unchanged.
  //   Cap 2: takes effect at scale 4 (sqrt(4) = 2) and holds to MAX_SCALE 8,
  //   so marks stop at 6.0px / 3.8px and never become blobs.
  //   2D IS EXCLUDED — see radiusScale().
  var R_ZOOM_CAP = 2;
  function radiusScale() {
    // 2D keeps constant-screen-px marks. Growing them there would add overlap
    // that carries NO information (a 2D map has no depth to occlude), and it
    // measurably costs separation: at 2x zoom the share of visibly clipped
    // nodes would rise 32.4% -> 52.4%, at 4x 8.1% -> 29.3%. In 3D that same
    // overlap IS the signal; in 2D it is only noise, so this is gated to 3D.
    if (!(mode3d && has3d)) return 1;
    var f = Math.max(1, Math.min(R_ZOOM_CAP, Math.sqrt(view.scale)));
    // Quantised to 0.05 steps so the sprite cache stays small (a continuous
    // factor would mint a fresh sprite per zoom step). The FACTOR is rounded,
    // never the radius: every jitter-band radius is multiplied by the SAME
    // number, so the band's proportions hold exactly at every zoom.
    return Math.round(f * 20) / 20;
  }
  function scaledRadius(base) {
    return base * radiusScale();
  }

  // BRAINMAP-3D-DEPTH (Part C): the cloud's projected edge, in SCREEN space.
  // Derived from cloudProj (a world-space sphere; see cloud3) so it moves with
  // pan/zoom exactly as the cloud does and is invariant under rotation.
  // Returns null in 2D — the gesture is 3D-only.
  function cloudCircle() {
    if (!(mode3d && has3d) || !cloudProj) return null;
    return {
      x: cloudProj.px * view.scale + view.offsetX,
      y: cloudProj.py * view.scale + view.offsetY,
      r: cloudProj.r * view.scale
    };
  }
  // Press outside the cloud = pan; inside = rotate. This is the ONLY boundary
  // consulted for that decision (the arcball's virtual sphere no longer decides
  // anything — see sphereVec), so one screen position can never mean two things.
  function pressOutsideCloud(mx, my) {
    var c = cloudCircle();
    if (!c) return false;
    var dx = mx - c.x, dy = my - c.y;
    return (dx * dx + dy * dy) > (c.r * c.r);
  }

  // BRAINMAP-ATMOSPHERE: presentation state only — none of it encodes data.
  var INTRO_MS = 1800; // entry settle duration
  var CAM_MS = 450;    // eased-camera duration (search centring)
  var reducedMotion = false;
  try { reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var intro = { active: false, ease: 0, raf: 0, done: false };
  var camAnim = null;  // in-flight camera glide, or null
  var MIN_SCALE = 0.3, MAX_SCALE = 8;
  var isDragging = false, dragStartX = 0, dragStartY = 0,
      startOffsetX = 0, startOffsetY = 0, dragDist = 0;

  // position untouched. One stamp per node beats two path-fills per node.
  // BRAINMAP-3D-FREE-WINS (1/4): a node's sprite and alpha depend ONLY on
  // (domain, clustered, market_commercial) — never on the frame, the camera or
  // the filters. Measured: the per-node work AROUND drawImage cost 5.2ms of a
  // 53.5ms stamping pass, all of it string-keyed sprite lookups repeated
  // 14,225 times a frame for at most a few dozen distinct answers.
  //

  // combos (<= domains x 2 x 2) instead of the nodes. IDENTICAL PIXELS BY
  // CONSTRUCTION: the combo carries exactly the three inputs spriteFor and the
  // globalAlpha expression already used, and the resolved sprite is the same
  // object spriteCache would have returned. Radius depends on radiusScale()
  // (zoom in 3D), so the combo sprites are re-resolved whenever THAT changes —
  // once per frame, not once per node.

  var comboDomain = [], comboJitter = [], comboMarket = [];
  var comboSprite = [], comboAlpha = [];
  var comboRadiusScale = -1;    // radiusScale() the sprites were resolved at

  function buildNodeCombos() {
    // 77-APPLY §04: a combo is (domain, market, jitter step) — the clustered
    // flag no longer selects a sprite or an alpha, because linked and
    // unlinked nodes render identically. Combos stay small: 13 domains x 2 x
    // 12 steps worst case.
    var seen = {}, n = graph.nodes.length;
    nodeCombo = new Uint16Array(n);
    comboDomain = []; comboJitter = []; comboMarket = [];
    for (var i = 0; i < n; i++) {
      var nd = graph.nodes[i];
      var mk = nd.content_nature === "market_commercial";
      var js = jitterStep(i);
      var k = (nd.domain || "") + "|" + js + "|" + (mk ? 1 : 0);
      var id = seen[k];
      if (id === undefined) {
        id = comboDomain.length;
        seen[k] = id;
        comboDomain.push(nd.domain);
        comboJitter.push(js);
        comboMarket.push(mk);
      }
      nodeCombo[i] = id;
    }
    comboRadiusScale = -1;   // force a resolve on the next draw
  }

  function refreshComboSprites() {
    var rs = radiusScale();
    if (rs === comboRadiusScale && comboSprite.length === comboDomain.length) return;
    comboRadiusScale = rs;
    comboSprite = []; comboAlpha = [];
    for (var c = 0; c < comboDomain.length; c++) {
      comboSprite.push(spriteFor(
        colorFor(comboDomain[c]),
        scaledRadius(jitterRadius(comboJitter[c])),
        comboMarket[c]));
      // §04: ONE alpha for every solid node, linked or not; the market class
      // keeps its shipped 0.75 — its distinction is the hollow SHAPE.
      comboAlpha.push(comboMarket[c] ? 0.75 : 0.95);
    }
  }

  function spriteFor(color, r, hollow) {
    var dpr = window.devicePixelRatio || 1;
    var key = color + "|" + r + "|" + (hollow ? 1 : 0) + "|" + dpr;
    var hit = spriteCache[key];
    if (hit) return hit;
    // LEGIBILITY: INSET ring — the sprite's footprint is exactly r. The bg
    // disc fills radius r; the colour disc sits at r-RING_W, leaving a thin
    // background-colour rim INSIDE the radius. Where nodes overlap, the rim
    // of the one drawn later still punches the visible gap into the one
    // below — identical width everywhere, encodes nothing — but a node no
    // longer wears a footprint larger than its own radius.
    var size = Math.ceil(r * 2) + 1;
    var c = document.createElement("canvas");
    c.width = Math.ceil(size * dpr);
    c.height = Math.ceil(size * dpr);

    g.scale(dpr, dpr);

    g.arc(cx, cy, r, 0, Math.PI * 2);

    g.fill();

      // pulled inside the rim so the footprint stays r.
      g.beginPath();
      g.arc(cx, cy, Math.max(0.5, r - RING_W - 0.7), 0, Math.PI * 2);
      g.lineWidth = 1.4;
      g.strokeStyle = color;
      g.stroke();

      // screen). Sprite path kept: ring+disc as ONE stamp is the simpler
      // draw loop and half the per-frame path work of the direct pair.
      g.beginPath();
      g.arc(cx, cy, Math.max(0.5, r - RING_W), 0, Math.PI * 2);
      g.fillStyle = color;
      g.fill();

    return hit;
  }

  // BRAINMAP-FILTER: is this node in the active filter's set? (all -> always).
  // BRAINMAP-FEATURES: extended — domain/market AND spread-size AND search
  // must ALL pass. Each block returns false independently; no filter = pass.
  function isActive(n) {

    // domain/spread/search conditions already use — one predicate, one dimming
    // path. A node is lit only if it passes every active condition.
    if (focusCluster !== null) {

    if (hideMarket && n.content_nature === "market_commercial") return false;
    // BRAINMAP-MULTI-DOMAIN: still ONE link in the same AND chain. A node passes
    // when its domain is ANY of the selected ones (OR within the domain
    // condition), and an EMPTY selection imposes no condition at all — which is
    // why removing the last domain returns to the whole map rather than
    // blanking it. Selection order is never consulted.
    if (marketOnly && n.content_nature !== "market_commercial") return false;
    if (domainSel.length
        && domainSel.indexOf(n.domain || "기타-미분류") === -1) return false;

      // Metric: the node's CLUSTER outlet_count. Isolated nodes (no cluster)
      // never meet an "N개 매체 이상" threshold — they dim, correctly (single
      // -outlet by definition).
      var c = (n.cluster_id !== null && n.cluster_id !== undefined)
        ? clusterById[n.cluster_id] : null;
      if (!c || !(c.outlet_count >= spreadMin)) return false;
    }
    if (searchQuery) {
      if ((n.title || "").toLowerCase().indexOf(searchQuery) === -1) return false;
    }
    return true;
  }

  function buildLegend(nodes) {
    var counts = {};

      var d = n.domain || "기타-미분류";

    var order = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });

    // unchanged — same data-filter kinds, same delegated click handler, same
    // mutual exclusions; only the chrome moved from wrapping chip rows to the
    // rail's column. 전체 보기 (active by default) restores all; a domain row
    // isolates its constellation; the hollow market row isolates 시장·시세
    // nodes. Palette hex unchanged.
    // BRAINMAP-MULTI-DOMAIN: 분야 여러 개 고르기 is the touch route to
    // combining domains, paired with 전체 보기 because both set the SCOPE of
    // the domain selection — a segmented pair above the list it governs. On
    // desktop Ctrl/⌘/Shift+click does the same thing without a mode.
    var html = '<div class="seg">' +
               '<button type="button" class="key key-all active" data-filter="all" aria-pressed="true">전체 보기</button>' +
               '<button type="button" class="key" data-filter="multi-arm" aria-pressed="false">분야 여러 개 고르기</button>' +
               '</div>';
    html += '<div class="dgrid">';
    html += order.map(function (d) {
      var name = DOMAIN_KO[d] || d;
      // The box span is ALWAYS present (shown only in multi-select mode, as a
      // filled-when-selected square — no ✓ glyph anywhere in this product) so

             escapeHtml(name) + "</button>";

    // domain has, which is a FACT about the corpus and not a judgement about
    // which domain matters more. The footnote stays attached to the list so
    // the order cannot be read as a ranking — the same disclosure the search
    // stepper makes about its own ordering.
    html += '<div class="legend-note">분야 순서는 기사 수 순 · 중요도 아님</div>';
    html += '<div class="rail-div"></div>';
    html += '<button type="button" class="key" data-filter="market" aria-pressed="false">' +

    html += '<button type="button" class="key key-switch" data-filter="nature-hide" aria-pressed="false">' +

    // carries 3D coordinates. Default is ALWAYS the 2D map.

    // map body now — #modeHint — not a rail row; updateModeHint still owns it.)
    if (has3d) {
      html += '<button type="button" class="key key-switch" data-filter="mode3d" aria-pressed="false">' +

  // BRAINMAP-3D-FREE-WINS (4/4): per-frame scratch, allocated once. Every one
  // of these is fully overwritten before it is read, so reuse cannot leak state
  // between frames.
  var posPool = null, depthPool = null, bucketStartPool = null, bucketEdgePool = null;
  function positionSlots(n) {

    if (!depthPool || depthPool.length !== n) depthPool = new Float64Array(n);

  }
  function bucketStartBuf() {
    if (!bucketStartPool) bucketStartPool = new Int32Array(DEPTH_BUCKETS + 1);
    return bucketStartPool;
  }
  var clusterMemberCache = null, labelTopCache = null;
  function clusterMembers() {
    if (clusterMemberCache) return clusterMemberCache;
    clusterMemberCache = {};
    graph.nodes.forEach(function (n, i) {
      if (n.cluster_id === null || n.cluster_id === undefined) return;
      (clusterMemberCache[n.cluster_id] = clusterMemberCache[n.cluster_id] || []).push(i);
    });
    return clusterMemberCache;
  }
  // 77-APPLY §04 hover lift: cluster_id -> indexes into graph.edges whose BOTH
  // endpoints are in that cluster. Built once, lazily — membership never
  // changes while a graph is loaded.
  var clusterEdgeCache = null;
  function clusterEdges() {
    if (clusterEdgeCache) return clusterEdgeCache;
    clusterEdgeCache = {};
    graph.edges.forEach(function (e, ei) {
      var a = nodeById[e.src], b = nodeById[e.dst];
      if (!a || !b) return;
      var ca = a.cluster_id, cb = b.cluster_id;
      if (ca === null || ca === undefined || ca !== cb) return;
      (clusterEdgeCache[ca] = clusterEdgeCache[ca] || []).push(ei);
    });
    return clusterEdgeCache;
  }
  function labelTopClusters() {
    if (labelTopCache) return labelTopCache;
    labelTopCache = graph.clusters
      .filter(function (c) { return c.size >= LABEL_MIN_SIZE; })
      .slice(0, LABEL_TOP_N);
    return labelTopCache;
  }

  function bucketEdgeBuf() {
    if (!bucketEdgePool) {
      bucketEdgePool = [];
      for (var i = 0; i < DEPTH_BUCKETS; i++) bucketEdgePool.push([]);
    }
    for (var j = 0; j < DEPTH_BUCKETS; j++) bucketEdgePool[j].length = 0;
    return bucketEdgePool;

  // BRAINMAP-3D-FREE-WINS (2/4): far-to-near order WITHOUT a full re-sort.
  // One frame of a drag moves every node's depth by a hair: measured at
  // 0.7 deg/frame, 49% of adjacent RANK pairs invert, but of ~35,274
  // overlapping on-screen node pairs only ~3 (0.01%) change which one occludes
  // the other — and those are pairs at near-equal depth, where either order
  // paints the same. An insertion pass over the PREVIOUS order costs 1.34ms
  // against 4.07ms for the comparator sort, and — this is the point — it
  // produces a FULLY SORTED array, not an approximation: the output is exactly
  // what the full sort would have produced, so the paint order is identical.
  //
  // The guard is the whole risk. Insertion sort is O(n^2) on badly-ordered
  // input, and 리셋 / a mode switch / a fast fling can hand it exactly that.
  // So the shifts are BUDGETED: past 8n moves it abandons the pass and falls
  // back to the full sort, bounding the wasted work at a fraction of a
  // millisecond. Correctness never depends on the budget — only speed does.
  var SORT_MOVE_BUDGET = 8;
  // Slack added to every off-screen test, in CSS px. Stroked geometry paints
  // wider than its coordinates (line width + antialias), so a bare boundary
  // test drops a sliver that a reader could see. Measured: without this, the
  // before/after pixel diff showed exactly 1 differing pixel at 4x and 8x.

      var moves = 0, budget = SORT_MOVE_BUDGET * n, blown = false;
      for (i = 1; i < n; i++) {
        v = order[i]; dv = depth[v]; j = i - 1;
        // The index tiebreak is what makes this EXACTLY the full sort's output
        // rather than merely a correct one. Array.prototype.sort is stable, so
        // sorting [0..n-1] by depth leaves exactly-equal depths in ascending
        // index order; matching that here means the two algorithms agree on
        // every input, ties included, and the paint order can never diverge.
        while (j >= 0 && (depth[order[j]] > dv
                          || (depth[order[j]] === dv && order[j] > v))) {
          order[j + 1] = order[j];
          j--;
          if (++moves > budget) { blown = true; break; }
        }
        order[j + 1] = v;
        if (blown) break;
      }
      if (!blown) return order;
    }
    var fresh = new Array(n);
    for (i = 0; i < n; i++) fresh[i] = i;
    fresh.sort(function (a, b) { return depth[a] - depth[b]; });
    return fresh;
  }

  function layout() {
    var rect = canvas.parentElement.getBoundingClientRect();
    var w = Math.max(320, rect.width), h = Math.max(280, rect.height);
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (mode3d && has3d) {
      // BRAINMAP-3D-VIEW: rotate the x3/y3/z3 cube about its centre (yaw
      // around the vertical axis, then pitch), project orthographically,
      // and fit with a FIXED scale so rotation never rescales the cloud.
      // `positions` stays the single world layer — every consumer (draw,
      // hit-test, hover, centring, labels) reads projected coordinates and
      // works unchanged. Depth exists ONLY as paint order (far-to-near).
      // BRAINMAP-3D-CONTROLS: one matrix multiply per node (was inline
      // yaw/pitch trig) — same cost, arbitrary axes.
      var m = rotM;
      // Fixed fit: a unit cube's rotated extent never exceeds sqrt(3)/2
      // from centre; 1.28 ~= a snug constant frame at every angle.
      var s3 = Math.min(w, h - PAD) / 1.28;
      var cxs = w / 2, cys = h / 2;
      // BRAINMAP-3D-FREE-WINS (4/4): the projection still runs every rotation
      // frame — it must, the numbers change — but its ALLOCATION does not.
      // `positions` used to mint 14,225 fresh {px,py} objects per frame; the
      // slots are now reused and overwritten. Same arithmetic in the same
      // order, so the coordinates are bit-identical; only the garbage is gone.
      var nCount = graph.nodes.length;
      var depth = depthBuf(nCount);
      var pos = positionSlots(nCount);
      for (var pi = 0; pi < nCount; pi++) {
        var pn = graph.nodes[pi];
        var vx = pn.x3 - 0.5, vy = pn.y3 - 0.5, vz = pn.z3 - 0.5;
        var rx = m[0] * vx + m[1] * vy + m[2] * vz;
        var ry = m[3] * vx + m[4] * vy + m[5] * vz;
        depth[pi] = m[6] * vx + m[7] * vy + m[8] * vz;
        pos[pi].px = cxs + rx * s3;
        pos[pi].py = cys + ry * s3;
      }
      positions = pos;
      // Far-to-near paint order: nearer nodes occlude farther ones — the
      // one honest depth cue besides motion parallax. Recomputed only when
      // rotation/layout changes, not on pan/zoom frames.
      drawOrder = orderByDepth(depth, drawOrder);
      // BRAINMAP-3D-DEPTH: project the cloud's bounding sphere. Because the
      // projection is linear, the projected centre is just the centre's
      // projection, and an orthographic projection of a sphere is a circle of
      // the SAME radius at every orientation — so cloudProj.r never changes as
      // the map turns (measured: <=2.5% variation in the cloud's actual p99
      // extent across 24 random orientations, i.e. it tracks the visible edge).
      if (cloud3) {
        var qx = cloud3.cx - 0.5, qy = cloud3.cy - 0.5, qz = cloud3.cz - 0.5;
        cloudProj = {
          px: cxs + (m[0] * qx + m[1] * qy + m[2] * qz) * s3,
          py: cys + (m[3] * qx + m[4] * qy + m[5] * qz) * s3,
          r: cloud3.r * s3
        };
      }
      // BRAINMAP-3D-DEPTH: bucket nodes AND edges by depth so the draw pass can
      // interleave them. Node buckets are contiguous slices of drawOrder (it is
      // already depth-sorted); an edge takes the mean depth of its endpoints.
      // Computed here — once per rotation — so pan/zoom frames pay nothing.
      var dmin = depth[drawOrder[0]], dmax = depth[drawOrder[drawOrder.length - 1]];
      var span = (dmax - dmin) || 1;
      // 77-APPLY §04 입체 보기: depth = size attenuation + NEUTRAL distance
      // fade only — no hue shift with depth, so 3D stays navigation, not
      // decoration. stampNode reads these; null in 2D (see the else branch).
      depth3d = depth; depth3dMin = dmin; depth3dSpan = span;
      function bucketOf(d) {
        var b = Math.floor((d - dmin) / span * DEPTH_BUCKETS);
        return b < 0 ? 0 : (b >= DEPTH_BUCKETS ? DEPTH_BUCKETS - 1 : b);
      }
      // BRAINMAP-3D-FREE-WINS (4/4): an edge's bucket depends on depth, so the
      // GROUPING cannot be hoisted — but rebuilding 25 typed arrays and 24
      // JS arrays every frame can. The buffers are allocated once and emptied
      // in place; the contents and their order are exactly what the old code
      // produced (same scan, same push order), so the paint is identical.
      bucketNodeStart = bucketStartBuf();
      for (var bi = 0, oi = 0; bi < DEPTH_BUCKETS; bi++) {
        bucketNodeStart[bi] = oi;
        while (oi < drawOrder.length && bucketOf(depth[drawOrder[oi]]) === bi) oi++;
        bucketNodeStart[bi + 1] = oi;
      }
      bucketNodeStart[DEPTH_BUCKETS] = drawOrder.length;
      bucketEdges = bucketEdgeBuf();
      graph.edges.forEach(function (e, ei) {
        var a = nodeById[e.src], b2 = nodeById[e.dst];
        if (!a || !b2) return;

    } else {
      drawOrder = null;
      cloudProj = null;
      bucketNodeStart = null;
      bucketEdges = null;
      depth3d = null;
      // Same allocation hoist on the 2D side, same bit-identical arithmetic.
      var pos2 = positionSlots(graph.nodes.length);
      for (var qi = 0; qi < graph.nodes.length; qi++) {
        var qn = graph.nodes[qi];
        pos2[qi].px = PAD + qn.x * (w - PAD * 2);
        pos2[qi].py = PAD + qn.y * (h - PAD * 2);
      }
      positions = pos2;
    }

    // Top-N cluster label placements at each cluster's centroid.
    // BRAINMAP-3D-FREE-WINS (4/4): the MEMBERSHIP grouping and the top-N pick
    // never change while a graph is loaded, so they are built once instead of
    // per rotation frame. The centroid is still summed from the live
    // `positions` in the same order over the same members, so every anchor is
    // bit-identical to before — only the O(nodes) regrouping is gone.
    var byCluster = clusterMembers();
    var top = labelTopClusters();
    labelSpots = top.map(function (c) {
      var members = byCluster[c.cluster_id] || [];
      var cx = 0, cy = 0;
      members.forEach(function (i) { cx += positions[i].px; cy += positions[i].py; });
      var m = Math.max(1, members.length);
      var title = c.label_title || "";
      if (title.length > 20) title = title.slice(0, 20) + "…";
      return { cluster_id: c.cluster_id, x: cx / m, y: cy / m, title: title, spread: c.size_label };
    });
    // 76-APPLY §03: anchors for the zoom ladder's ADDED labels — every cluster
    // not already in the base pick, via the SAME centroid mechanism (same
    // members, same truncation). draw() gates them by view.scale and skips
    // off-screen anchors; nothing here re-places or re-orders the base set.
    var inBase = {};
    top.forEach(function (c) { inBase[c.cluster_id] = true; });
    extraLabelSpots = [];
    graph.clusters.forEach(function (c) {
      if (inBase[c.cluster_id]) return;
      var members = byCluster[c.cluster_id] || [];
      if (!members.length) return;
      var cx = 0, cy = 0;
      members.forEach(function (i) { cx += positions[i].px; cy += positions[i].py; });
      var m = members.length;
      var title = c.label_title || "";
      if (title.length > 20) title = title.slice(0, 20) + "…";
      extraLabelSpots.push({ cluster_id: c.cluster_id, x: cx / m, y: cy / m,
        title: title, spread: c.size_label, outlets: c.outlet_count || 0 });
    });
    // 77-APPLY B: collision priority is ACCESSION ORDER (cluster_id
    // ascending) within each tier — meaning-free, stable, and explicitly not
    // size, so no cluster's label wins a spot by being bigger.
    labelSpots.sort(function (a, b) { return a.cluster_id - b.cluster_id; });
    extraLabelSpots.sort(function (a, b) { return a.cluster_id - b.cluster_id; });
  }

  function draw() {
    var w = canvas.width / (window.devicePixelRatio || 1);
