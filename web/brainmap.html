<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스 연결지도 — tickedin</title>
<!-- LINK-PREVIEW: OG/Twitter tags mirror frontend/template.html's set. Spread/
     connection vocabulary only (유통/연결/확산) — no verdict words, no counts.
     Canonical URL has no query parameters. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="tickedin">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://tickedin.org/web/brainmap.html">
<meta property="og:title" content="뉴스 연결지도 — tickedin">
<meta property="og:description" content="정책 뉴스가 매체 사이에서 어떻게 유통되고 연결되는지 보여주는 뉴스 연결지도. 유통·연결을 보여주며 검증이 아닙니다.">
<meta property="og:image" content="https://tickedin.org/web/assets/og-brainmap.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="tickedin 뉴스 연결지도 — 뉴스의 유통·연결을 보여주는 지도">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="뉴스 연결지도 — tickedin">
<meta name="twitter:description" content="정책 뉴스가 매체 사이에서 어떻게 유통되고 연결되는지 보여주는 뉴스 연결지도. 유통·연결을 보여주며 검증이 아닙니다.">
<meta name="twitter:image" content="https://tickedin.org/web/assets/og-brainmap.png">
<!--
  BRAINMAP 2d-ii — standalone, hand-authored page (NOT build_index-managed;
  touches none of the index pins). Fetches GET /api/brainmap (the newest
  brainmap_graph row) and renders the 유통/연결 (spread/connection) graph on a
  single canvas. VERDICT-ISOLATED: this page shows NO verdict — cluster labels
  render the stored "N개 매체 보도 중" (spread) verbatim; a node click links
  BACK to its verification card (/?result_id=N) where verification lives.
  Self-contained: inline CSS + JS, no external lib/CDN.
-->
<style>
  /* BRAINMAP-COHESION: tokens mirrored from the main site's design system
     (frontend/styles/main.css :root) so this standalone page reads as tickedin.
     Values copied, not linked — the page stays self-contained (no CDN). */
  /* BRAINMAP-ATMOSPHERE: this page moves to a dark canvas so the domain
     colours read as points of light. Tokens are PAGE-LOCAL (copied, never
     linked) — the home page keeps its light, restrained treatment untouched.
     Encodings are unchanged: x/y = embedding location, size = outlet count,
     colour = domain. Only the atmosphere changes. */
  :root {
    color-scheme: dark;      /* native form controls (select) match the page */
    --ink: #e8eef9;          /* headings / strong text */
    --slate: #b6c2d6;        /* body text */
    --muted: #8ea0ba;        /* captions / secondary */
    --line: #24334e;         /* borders */
    --paper: #101a2e;        /* header / card surface */
    --canvas: #0b1220;       /* page background — the night canvas */
    --brand: #4d86e8;        /* tickedin blue, lifted for dark */
    --brand-ink: #9ec1ff;    /* light blue: hover / links / active text */
    --shadow: 0 8px 24px rgba(2, 6, 16, 0.55);
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    /* Site body font stack (Pretendard on the main site; graceful Korean
       system fallbacks here — no CDN font load on this standalone page). */
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header.map-head {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px 14px;
    flex: 0 0 auto;
  }
  /* tickedin identity row — mirrors the site's .brand treatment (favicon mark +
     serif wordmark). The wordmark links home. */
  .brand-row {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); text-decoration: none;
    font-family: 'Noto Serif KR', 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
    font-size: 21px; font-weight: 700; letter-spacing: -0.01em;
  }
  .brand img { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: middle; }
  .brand-page-label {
    color: var(--muted); font-size: 13px; font-weight: 600;
    padding-left: 12px; border-left: 1px solid var(--line);
  }
  .map-home {
    margin-left: auto; font-size: 13px; font-weight: 600;
    color: var(--brand-ink); text-decoration: none;
  }
  .map-home:hover { text-decoration: underline; }
  .map-reset {
    /* BRAINMAP-FEATURES: margin-left:auto moved to .map-search so the whole
       search+count+spread+리셋 group right-aligns together. */
    font-size: 12.5px; font-weight: 600; padding: 5px 13px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper); color: var(--slate); cursor: pointer;
    font-family: inherit;
  }
  .map-reset:hover { color: var(--ink); border-color: var(--muted); }
  /* BRAINMAP-FOCUS: the focus chip is the 리셋 button's chrome with the brand
     accent, so an active focus is visible without inventing a new control
     language. Not a data encoding — a UI state. */
  .map-focus { border-color: var(--brand); color: var(--brand-ink); background: #142642; }
  .map-focus[disabled] { border-color: var(--line); color: var(--slate); background: var(--paper); cursor: default; }
  /* BRAINMAP-FEATURES: search input + spread dropdown share the 리셋 button's
     calm chrome (site tokens). The count is a muted live annotation. */
  .map-search {
    margin-left: auto;
    font-size: 12.5px; padding: 5px 11px; width: 170px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper); color: var(--ink); font-family: inherit;
  }
  .map-search:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .search-count { font-size: 12px; color: var(--slate); white-space: nowrap; }
  .map-spread {
    font-size: 12.5px; font-weight: 600; padding: 5px 9px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper); color: var(--slate); cursor: pointer;
    font-family: inherit;
  }
  .map-spread:hover { color: var(--ink); border-color: var(--muted); }
  .map-stats { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .head-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .map-title {
    font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink);
    /* FONT-SWITCH: page title joins the body sans stack; only .brand stays serif. */
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  /* HONESTY (fixed, always visible): this map is spread/connection, NOT verification. */
  .map-subtitle { margin-top: 6px; font-size: 13.5px; line-height: 1.55; color: var(--slate); }
  .map-subtitle strong { color: var(--ink); font-weight: 700; }
  .legend {
    margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 16px;
    font-size: 12.5px; color: var(--slate); align-items: center;
  }
  /* BRAINMAP-FILTER: legend keys are interactive filter toggles. They read as
     calm tappable chips (site tokens), with a clear active state. Clicking a
     domain isolates its constellation; "전체 보기" restores all. */
  .legend .key {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit; font-size: 12.5px; color: var(--slate);
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    padding: 3px 10px; cursor: pointer; line-height: 1.15;
    transition: background .12s, border-color .12s, color .12s;
  }
  .legend .key:hover { background: #17233a; border-color: var(--line); color: var(--ink); }
  .legend .key:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .legend .key.active {
    background: #142642; border-color: var(--brand); color: var(--brand-ink); font-weight: 700;
  }
  .legend .dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  }
  .legend .dot.hollow { background: transparent !important; border: 2px solid #8b9cb6; }
  main.map-body { position: relative; flex: 1 1 auto; min-height: 0; }
  /* MOBILE-POLISH H: touch-action:none is what lets the touch handlers below see a
     coherent gesture — the default (auto) hands one-finger drags and pinches to the
     browser as page scroll/zoom before any JS runs, so the graph could never pan or
     pinch on a phone. No effect on mouse input. */
  canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
  /* Tooltip as a light site-style card (paper surface, line border, soft shadow). */
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    max-width: 320px; padding: 9px 12px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-size: 12.5px; line-height: 1.5;
    box-shadow: var(--shadow); z-index: 5;
  }
  #tooltip .tip-spread { color: var(--brand-ink); margin-top: 4px; font-size: 12px; font-weight: 600; }
  #status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--slate); font-size: 15px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<header class="map-head">
  <!-- BRAINMAP-COHESION: tickedin identity row — the site's wordmark (favicon
       mark + serif "tickedin", same treatment as the main header's .brand),
       linking home, with the page label + return link. -->
  <div class="brand-row">
    <a class="brand" href="/" aria-label="tickedin 홈으로"><img src="/web/assets/favicon-180.png" alt="" aria-hidden="true">tickedin</a>
    <span class="brand-page-label">연결지도</span>
    <a class="map-home" href="/">← 홈으로</a>
  </div>
  <div class="head-row">
    <span class="map-title">뉴스 연결지도</span>
    <!-- BRAINMAP-FEATURES: keyword search (substring over node titles, dims
         non-matches via the SAME isActive mechanism the domain filter uses) +
         a spread-size dropdown (cluster outlet_count threshold). Circulation
         vocabulary only — 일치/연결/매체, never verdict words. -->
    <input type="search" id="mapSearch" class="map-search" placeholder="제목 검색" autocomplete="off" aria-label="노드 제목 검색">
    <span id="searchCount" class="search-count" aria-live="polite"></span>
    <select id="spreadFilter" class="map-spread" aria-label="확산 규모 필터">
      <option value="0" selected>확산 규모: 전체</option>
      <option value="3">3개 매체 이상 보도</option>
      <option value="5">5개 매체 이상 보도</option>
      <option value="10">10개 매체 이상 보도</option>
    </select>
    <!-- BRAINMAP-FOCUS: appears only while a cluster is focused (or the
         one-shot arm is waiting). Lives in the same wrapping flex row as the
         other controls, so it reflows onto its own line on a narrow screen. -->
    <button type="button" id="focusChip" class="map-reset map-focus" style="display:none"></button>
    <button type="button" id="resetView" class="map-reset">리셋</button>
  </div>
  <p class="map-subtitle">
    이 지도는 뉴스의 <strong>유통·연결</strong>을 보여줍니다. <strong>검증이 아닙니다.</strong>
    가까이 모인 점은 비슷한 내용이 여러 매체에 보도되었다는 뜻일 뿐, 사실 여부와는 무관합니다.
  </p>
  <div class="legend" id="legend" aria-label="범례"></div>
  <!-- BRAINMAP-FEATURES: one-line numeric stats over the FULL loaded graph
       (not the filtered view) — circulation counts only. -->
  <div class="map-stats" id="mapStats"></div>
</header>
<main class="map-body">
  <canvas id="map"></canvas>
  <div id="status">지도를 불러오는 중…</div>
  <div id="tooltip"></div>
</main>
<script>
(function () {
  "use strict";

  // Fixed categorical palette per domain. BRAINMAP-ATMOSPHERE: the same HUE
  // per domain as the original light-bg palette, lifted in lightness so the
  // points read as lights on the dark canvas. The ENCODING (domain -> hue
  // family) is unchanged — only luminance moved with the background.
  var DOMAIN_COLORS = {
    "finance":      "#5aa2e8",
    "welfare":      "#e0a84a",
    "agriculture":  "#55c088",
    "labor":        "#cf8a3d",
    "health":       "#ef6a6a",
    "environment":  "#4fc0c2",
    "SMB":          "#a789ec",
    "realestate":   "#e86ab4",
    "statistics":   "#93a3ba",
    "education":    "#8b90ef",
    "scitech":      "#38b6d8",
    "trade":        "#e0578f",
    "기타-미분류":   "#8b97a8"
  };
  var DOMAIN_KO = {
    "finance": "금융", "welfare": "복지", "agriculture": "농어업",
    "labor": "고용·노동", "health": "보건", "environment": "환경",
    "SMB": "소상공인·중기", "realestate": "부동산", "statistics": "통계",
    "education": "교육",
    "scitech": "과학기술", "trade": "산업·통상",
    "기타-미분류": "기타"
  };
  var FALLBACK_COLOR = "#98a2b3";
  var PAD = 40;             // canvas margin (px)
  var HIT_RADIUS = 9;       // hover hit-test radius (px)
  var LABEL_TOP_N = 12;     // clusters drawn with an always-on label
  var LABEL_MIN_SIZE = 5;

  var canvas = document.getElementById("map");
  var ctx = canvas.getContext("2d");
  var tooltip = document.getElementById("tooltip");
  var statusEl = document.getElementById("status");

  var graph = null;         // {nodes, edges, clusters}
  var nodeById = {};        // id -> node
  var clusterById = {};     // cluster_id -> cluster meta
  var positions = [];       // per node: {px, py} in CSS pixels
  var labelSpots = [];      // top-cluster label placements
  var hoverNode = null;

  // BRAINMAP-FILTER: client-side domain filter over the already-loaded nodes
  // (no new fetch, no data change). null = show all; {type:'domain', value}
  // isolates one domain; {type:'market'} isolates market_commercial nodes.
  var activeFilter = null;
  // BRAINMAP-FEATURES: two ADDITIONAL client-side conditions that compose with
  // the domain filter via AND in isActive — a node stays lit only if it passes
  // ALL active conditions. Circulation-only (title match / cluster outlet
  // count); never verdict-based.
  var searchQuery = "";     // lowercased substring over node.title ("" = off)
  var spreadMin = 0;        // min cluster outlet_count (0 = off)
  var hasEdgeById = {};     // node id -> true when the node has >=1 edge
  // BRAINMAP-FOCUS: two more conditions on the SAME AND chain in isActive.
  // Neither adds a filtering path, a fetch, or a payload field — cluster_id
  // and content_nature are already on every node.
  //   focusCluster: a cluster_id whose constellation stays lit while the rest
  //     of the map dims. null = off.
  //   focusArmed: one-shot mode so a TAP can focus on touch, where there is no
  //     modifier key. Disarms itself after one focus so a plain tap goes back
  //     to opening the card — the mode can never get stuck on.
  //   hideMarket: hides 시장·시세 items (content_nature === market_commercial).
  var focusCluster = null;
  var focusArmed = false;
  var hideMarket = false;
  var focusNoteTimer = null;

  function anyFilterActive() {
    return activeFilter !== null || searchQuery !== "" || spreadMin > 0
      || focusCluster !== null || hideMarket;
  }

  // View transform (pan/zoom). Screen = world * scale + offset. Initial
  // {1, 0, 0} is byte-identical to the original static fit-to-viewport view.
  // `positions` / `labelSpots` remain the WORLD layer; this rides on top so
  // node radii, line widths, and label fonts stay constant in SCREEN pixels
  // at any zoom, and the hover hit test uses a constant screen-px radius.
  var view = { scale: 1, offsetX: 0, offsetY: 0 };

  // BRAINMAP-DEPTH-STYLE: rendering constants. Coordinates NEVER move; only
  // how a node is painted changes. Everything here is IDENTICAL for every
  // node, so none of it encodes anything.
  var R_CLUSTERED = 3.0;    // was 3.4 — small trim against bright-on-dark
  var R_UNCLUSTERED = 1.9;  // was 2.1 —   irradiation (hue mapping untouched)
  // LEGIBILITY: ring thinned 1.25 -> 0.5 and drawn INSET, so a node's
  // footprint is exactly its radius (was r+1.25 — a 1.9px node wore a
  // 3.15px footprint and read as a hollow donut). Uniform for every node.
  var RING_W = 0.5;         // separation ring in the page background colour
  var BG_COLOR = "#0b1220"; // must equal --canvas
  var spriteCache = {};     // (color|radius|hollow|dpr) -> prerendered sprite

  // BRAINMAP-ATMOSPHERE: presentation state only — none of it encodes data.
  var INTRO_MS = 1800; // entry settle duration
  var CAM_MS = 450;    // eased-camera duration (search centring)
  var reducedMotion = false;
  try { reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var intro = { active: false, ease: 0, raf: 0, done: false };
  var camAnim = null;  // in-flight camera glide, or null
  var MIN_SCALE = 0.3, MAX_SCALE = 8;
  var isDragging = false, dragStartX = 0, dragStartY = 0,
      startOffsetX = 0, startOffsetY = 0, dragDist = 0;
  var CLICK_MOVE_THRESHOLD = 4; // screen px; a mouseup past this = pan, not click

  function toScreenX(px) { return px * view.scale + view.offsetX; }
  function toScreenY(py) { return py * view.scale + view.offsetY; }

  function colorFor(domain) {
    return DOMAIN_COLORS[domain] || FALLBACK_COLOR;
  }

  // BRAINMAP-DEPTH-STYLE (bead reverted): prerendered node sprites — a flat
  // domain-colour disc wrapped in a background-colour separation ring, the
  // same treatment for every node, so it encodes NOTHING; hue still = domain,
  // position untouched. One stamp per node beats two path-fills per node.
  function spriteFor(color, r, hollow) {
    var dpr = window.devicePixelRatio || 1;
    var key = color + "|" + r + "|" + (hollow ? 1 : 0) + "|" + dpr;
    var hit = spriteCache[key];
    if (hit) return hit;
    // LEGIBILITY: INSET ring — the sprite's footprint is exactly r. The bg
    // disc fills radius r; the colour disc sits at r-RING_W, leaving a thin
    // background-colour rim INSIDE the radius. Where nodes overlap, the rim
    // of the one drawn later still punches the visible gap into the one
    // below — identical width everywhere, encodes nothing — but a node no
    // longer wears a footprint larger than its own radius.
    var size = Math.ceil(r * 2) + 1;
    var c = document.createElement("canvas");
    c.width = Math.ceil(size * dpr);
    c.height = Math.ceil(size * dpr);
    var g = c.getContext("2d");
    g.scale(dpr, dpr);
    var cx = size / 2, cy = size / 2;
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.fillStyle = BG_COLOR;
    g.fill();
    if (hollow) {
      // market_commercial stays a hollow stroke (existing convention),
      // pulled inside the rim so the footprint stays r.
      g.beginPath();
      g.arc(cx, cy, Math.max(0.5, r - RING_W - 0.7), 0, Math.PI * 2);
      g.lineWidth = 1.4;
      g.strokeStyle = color;
      g.stroke();
    } else {
      // BEAD-REVERT: flat disc (the shaded bead read as a donut on a real
      // screen). Sprite path kept: ring+disc as ONE stamp is the simpler
      // draw loop and half the per-frame path work of the direct pair.
      g.beginPath();
      g.arc(cx, cy, Math.max(0.5, r - RING_W), 0, Math.PI * 2);
      g.fillStyle = color;
      g.fill();
    }
    hit = { c: c, size: size, half: size / 2 };
    spriteCache[key] = hit;
    return hit;
  }

  // BRAINMAP-FILTER: is this node in the active filter's set? (all -> always).
  // BRAINMAP-FEATURES: extended — domain/market AND spread-size AND search
  // must ALL pass. Each block returns false independently; no filter = pass.
  function isActive(n) {
    // BRAINMAP-FOCUS: focus and content-nature join the SAME AND chain the
    // domain/spread/search conditions already use — one predicate, one dimming
    // path. A node is lit only if it passes every active condition.
    if (focusCluster !== null) {
      if (n.cluster_id !== focusCluster) return false;
    }
    if (hideMarket && n.content_nature === "market_commercial") return false;
    if (activeFilter) {
      if (activeFilter.type === "market") {
        if (n.content_nature !== "market_commercial") return false;
      } else if ((n.domain || "기타-미분류") !== activeFilter.value) {
        return false;
      }
    }
    if (spreadMin > 0) {
      // Metric: the node's CLUSTER outlet_count. Isolated nodes (no cluster)
      // never meet an "N개 매체 이상" threshold — they dim, correctly (single
      // -outlet by definition).
      var c = (n.cluster_id !== null && n.cluster_id !== undefined)
        ? clusterById[n.cluster_id] : null;
      if (!c || !(c.outlet_count >= spreadMin)) return false;
    }
    if (searchQuery) {
      if ((n.title || "").toLowerCase().indexOf(searchQuery) === -1) return false;
    }
    return true;
  }

  function buildLegend(nodes) {
    var counts = {};
    nodes.forEach(function (n) {
      var d = n.domain || "기타-미분류";
      counts[d] = (counts[d] || 0) + 1;
    });
    var order = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    // BRAINMAP-FILTER: each key is a filter toggle. "전체 보기" (active by
    // default) restores all; a domain key isolates its constellation; the
    // hollow market key isolates 시장·시세 nodes. Palette hex unchanged.
    var html = '<button type="button" class="key key-all active" data-filter="all">전체 보기</button>';
    html += order.map(function (d) {
      var name = DOMAIN_KO[d] || d;
      return '<button type="button" class="key" data-filter="domain" data-domain="' + escapeHtml(d) + '">' +
             '<span class="dot" style="background:' + colorFor(d) + '"></span>' +
             escapeHtml(name) + "</button>";
    }).join("");
    html += '<button type="button" class="key" data-filter="market">' +
            '<span class="dot hollow"></span>시장·시세 소식(빈 점)</button>';
    // BRAINMAP-FOCUS: content-nature toggle. Same .key chip, same delegated
    // click handler, same dimming — it only adds one AND condition. The label
    // reuses the existing "시장·시세 소식" wording verbatim from the key above
    // (and the home page's 시장·시세 chip); only the verb is new.
    html += '<button type="button" class="key" data-filter="nature-hide">' +
            '시장·시세 소식 숨기기</button>';
    // BRAINMAP-FOCUS: one-shot arm for touch (no modifier key on a phone).
    html += '<button type="button" class="key" data-filter="focus-arm">' +
            '집중 모드: 다음 탭한 묶음만</button>';
    document.getElementById("legend").innerHTML = html;
  }

  function layout() {
    var rect = canvas.parentElement.getBoundingClientRect();
    var w = Math.max(320, rect.width), h = Math.max(280, rect.height);
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    positions = graph.nodes.map(function (n) {
      return {
        px: PAD + n.x * (w - PAD * 2),
        py: PAD + n.y * (h - PAD * 2)
      };
    });

    // Top-N cluster label placements at each cluster's centroid.
    var byCluster = {};
    graph.nodes.forEach(function (n, i) {
      if (n.cluster_id === null || n.cluster_id === undefined) return;
      (byCluster[n.cluster_id] = byCluster[n.cluster_id] || []).push(i);
    });
    var top = graph.clusters
      .filter(function (c) { return c.size >= LABEL_MIN_SIZE; })
      .slice(0, LABEL_TOP_N);
    labelSpots = top.map(function (c) {
      var members = byCluster[c.cluster_id] || [];
      var cx = 0, cy = 0;
      members.forEach(function (i) { cx += positions[i].px; cy += positions[i].py; });
      var m = Math.max(1, members.length);
      var title = c.label_title || "";
      if (title.length > 20) title = title.slice(0, 20) + "…";
      return { cluster_id: c.cluster_id, x: cx / m, y: cy / m, title: title, spread: c.size_label };
    });
  }

  function draw() {
    var w = canvas.width / (window.devicePixelRatio || 1);
    var h = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);

    // BRAINMAP-ATMOSPHERE: during the entry animation nodes travel from the
    // canvas centre to their TRUE precomputed coordinates (kIntro: 0 -> 1).
    // Presentation only — kIntro ends at exactly 1, so every node lands on
    // its server-computed x/y. Never a different layout.
    var kIntro = intro.active ? intro.ease : 1;
    var icx = w / 2, icy = h / 2;
    function wx(i) { var p = positions[i]; return kIntro === 1 ? p.px : icx + (p.px - icx) * kIntro; }
    function wy(i) { var p = positions[i]; return kIntro === 1 ? p.py : icy + (p.py - icy) * kIntro; }

    // BRAINMAP-FILTER: when a domain is isolated, draw only edges whose BOTH
    // endpoints are in the active set (cross-domain edges are hidden).
    // BRAINMAP-FEATURES: "filtering" now covers domain OR search OR spread.
    var filtering = anyFilterActive();

    // Edges — straight lines again (LEGIBILITY). Measured: the arc added
    // only +0.95% length / +0.23pp coverage — the distance layout itself
    // tripled edge ink (327k -> 1,138k px) by drawing edges at their honest
    // similarity length. So the arc bought curvature noise without being
    // the cause, and prominence is managed below instead: thinner stroke +
    // zoom-graduated alpha. STYLE, NOT ENCODING: one width and one alpha
    // for EVERY edge at any given moment (alpha varies only with the view's
    // zoom, identically for all). Edges are never removed — faint at the
    // overview where 6,353 of them cannot be read anyway, full where zoom
    // makes them readable. Nodes are NEVER faded or hidden this way.
    var edgeAlpha = 0.10 + 0.06 * Math.min(1, Math.max(0, view.scale - 1));
    ctx.lineWidth = 0.5;
    ctx.strokeStyle = "rgba(148, 170, 205, " + edgeAlpha.toFixed(3) + ")";
    ctx.beginPath();
    graph.edges.forEach(function (e) {
      var a = nodeById[e.src], b = nodeById[e.dst];
      if (!a || !b) return;
      if (filtering && !(isActive(a) && isActive(b))) return;
      ctx.moveTo(toScreenX(wx(a._i)), toScreenY(wy(a._i)));
      ctx.lineTo(toScreenX(wx(b._i)), toScreenY(wy(b._i)));
    });
    ctx.stroke();

    // BRAINMAP-FILTER: when filtering, draw the non-matching nodes first as a
    // faint underlay — the selected set pops while its place in the whole map
    // stays visible (dim, not hide, to keep spatial context).
    if (filtering) {
      ctx.fillStyle = "#7e8ea8";
      graph.nodes.forEach(function (n, i) {
        if (isActive(n)) return;
        ctx.globalAlpha = 0.14;
        ctx.beginPath();
        ctx.arc(toScreenX(wx(i)), toScreenY(wy(i)), 1.8, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // Nodes on top. Clustered nodes slightly larger; market_commercial hollow.
    // Radii are constant screen px (positions transform, sizes do not).
    // BRAINMAP-DEPTH-STYLE: each node is a prerendered sprite (ring + flat
    // disc) STAMPED at its unchanged coordinate — one drawImage per node
    // instead of one path-fill per node. Alphas are the pre-existing
    // interaction/visual states, byte-identical to before.
    graph.nodes.forEach(function (n, i) {
      if (filtering && !isActive(n)) return;
      var clustered = n.cluster_id !== null && n.cluster_id !== undefined;
      var r = clustered ? R_CLUSTERED : R_UNCLUSTERED;
      var isMarket = n.content_nature === "market_commercial";
      var s = spriteFor(colorFor(n.domain), r, isMarket);
      ctx.globalAlpha = isMarket ? 0.75 : (clustered ? 0.95 : 0.6);
      ctx.drawImage(s.c, toScreenX(wx(i)) - s.half, toScreenY(wy(i)) - s.half,
                    s.size, s.size);
    });
    ctx.globalAlpha = 1;

    // Hover glow + ring — marks the POINTER only, never a data value, and is
    // identical for every node it touches.
    if (hoverNode && !intro.active) {
      var hx = toScreenX(wx(hoverNode._i)), hy = toScreenY(wy(hoverNode._i));
      var glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, 16);
      glow.addColorStop(0, "rgba(158, 193, 255, 0.35)");
      glow.addColorStop(1, "rgba(158, 193, 255, 0)");
      ctx.beginPath();
      ctx.fillStyle = glow;
      ctx.arc(hx, hy, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx, hy, 6, 0, Math.PI * 2);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = "#dbe7f8";
      ctx.stroke();
    }

    // BRAINMAP-FILTER: when filtering, only label clusters that still have a
    // visible (active) member.
    var activeClusters = null;
    if (filtering) {
      activeClusters = {};
      graph.nodes.forEach(function (n) {
        if (isActive(n) && n.cluster_id !== null && n.cluster_id !== undefined) {
          activeClusters[n.cluster_id] = true;
        }
      });
    }

    // Always-on labels for the biggest clusters — stored spread label VERBATIM.
    // Font stays constant screen size; only the anchor point transforms.
    // BRAINMAP-ATMOSPHERE: labels appear once the nodes have settled (their
    // anchors are centroids of FINAL positions, so drawing them mid-flight
    // would label empty space). Halo/ink swapped for the dark canvas.
    if (intro.active) return;
    ctx.textAlign = "center";
    labelSpots.forEach(function (s) {
      if (filtering && !activeClusters[s.cluster_id]) return;
      var lx = toScreenX(s.x), ly = toScreenY(s.y);
      ctx.font = "600 12px sans-serif";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(8, 13, 24, 0.85)";
      ctx.strokeText(s.title, lx, ly - 14);
      ctx.fillStyle = "#dce6f4";
      ctx.fillText(s.title, lx, ly - 14);
      ctx.font = "11px sans-serif";
      ctx.strokeText(s.spread, lx, ly);
      ctx.fillStyle = "#9fb0c8";
      ctx.fillText(s.spread, lx, ly);
    });
  }

  // Hit test in SCREEN space so the radius stays a constant ~9px at any zoom.
  function nearestNode(mx, my) {
    var best = null, bestD = HIT_RADIUS * HIT_RADIUS;
    var filtering = anyFilterActive();
    for (var i = 0; i < graph.nodes.length; i++) {
      // BRAINMAP-FILTER: hover/click only apply to visible (active) nodes.
      if (filtering && !isActive(graph.nodes[i])) continue;
      var dx = toScreenX(positions[i].px) - mx, dy = toScreenY(positions[i].py) - my;
      var d = dx * dx + dy * dy;
      if (d <= bestD) { bestD = d; best = graph.nodes[i]; }
    }
    return best;
  }

  function onMove(ev) {
    // BRAINMAP-ATMOSPHERE: while nodes are still travelling, hover would
    // tooltip a node that is not yet where the pointer is — suppress it.
    // (A passing mouse does NOT skip the intro; deliberate input does.)
    if (intro.active) return;
    var rect = canvas.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    if (isDragging) {
      // Pan: move the offset by the raw mouse delta; track distance so a
      // genuine click (below threshold) still navigates to the card.
      var ddx = ev.clientX - dragStartX, ddy = ev.clientY - dragStartY;
      dragDist = Math.max(dragDist, Math.abs(ddx) + Math.abs(ddy));
      view.offsetX = startOffsetX + ddx;
      view.offsetY = startOffsetY + ddy;
      hoverNode = null;
      tooltip.style.display = "none";
      draw();
      return;
    }
    var n = nearestNode(mx, my);
    if (n !== hoverNode) { hoverNode = n; draw(); }
    if (!n) { tooltip.style.display = "none"; canvas.style.cursor = "grab"; return; }
    canvas.style.cursor = "pointer";
    var spread = "";
    if (n.cluster_id !== null && n.cluster_id !== undefined && clusterById[n.cluster_id]) {
      spread = '<div class="tip-spread">' + clusterById[n.cluster_id].size_label +
        // BRAINMAP-FOCUS: the modifier is discoverable at the moment of use.
        (focusCluster === null ? " · Shift+클릭: 이 묶음만 보기" : "") + "</div>";
    }
    tooltip.innerHTML = escapeHtml(n.title || "(제목 없음)") + spread;
    tooltip.style.display = "block";
    var tx = Math.min(mx + 14, rect.width - 330);
    tooltip.style.left = Math.max(4, tx) + "px";
    tooltip.style.top = (my + 14) + "px";
  }

  function onDown(ev) {
    skipIntro(); cancelCamera();
    isDragging = true;
    dragStartX = ev.clientX; dragStartY = ev.clientY;
    startOffsetX = view.offsetX; startOffsetY = view.offsetY;
    dragDist = 0;
    canvas.style.cursor = "grabbing";
  }

  function onUp() {
    if (isDragging) { isDragging = false; canvas.style.cursor = "grab"; }
  }

  // Zoom by `factor`, anchored so the world point under the screen point (mx,my)
  // stays fixed. Extracted from onWheel unchanged (MOBILE-POLISH H) so the wheel
  // and the pinch below drive scale through the SAME math — the only difference is
  // where the anchor comes from (cursor vs pinch midpoint) and how the factor is
  // derived (wheel direction vs finger-distance ratio).
  function zoomAt(mx, my, factor) {
    var wx = (mx - view.offsetX) / view.scale;
    var wy = (my - view.offsetY) / view.scale;
    var s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, view.scale * factor));
    if (s === view.scale) return;
    view.scale = s;
    view.offsetX = mx - wx * s;
    view.offsetY = my - wy * s;
    hoverNode = null;
    tooltip.style.display = "none";
    draw();
  }

  // Scroll-to-zoom, anchored so the world point under the cursor stays fixed.
  function onWheel(ev) {
    skipIntro(); cancelCamera();
    ev.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    zoomAt(mx, my, ev.deltaY < 0 ? 1.1 : 1 / 1.1);
  }

  // ---- MOBILE-POLISH H: touch pan + pinch-zoom ----
  // Every handler above reads clientX/deltaY off a MouseEvent/WheelEvent. A pinch
  // never synthesizes a wheel event on any mobile browser, so onWheel is
  // unreachable from touch by construction — which is why wheel-zoom worked on
  // desktop while the graph did nothing at all on a phone. These handlers are
  // ADDITIVE: touch events never fire for a mouse, so the desktop path above keeps
  // its exact behavior. They reuse the existing view model, the MIN/MAX_SCALE
  // clamp (via zoomAt) and CLICK_MOVE_THRESHOLD rather than introducing their own.
  var touchPanId = null;   // identifier of the finger currently driving a pan
  var pinchGap = 0;        // finger distance at the previous pinch frame
  var touchMoved = false;  // gesture panned/pinched => suppress the synthesized click

  function fingerGap(a, b) {
    var dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Anchor a one-finger pan on `touch`, reusing the mouse drag's offset bookkeeping.
  function seatTouchPan(touch) {
    touchPanId = touch.identifier;
    dragStartX = touch.clientX; dragStartY = touch.clientY;
    startOffsetX = view.offsetX; startOffsetY = view.offsetY;
    pinchGap = 0;
  }

  function onTouchStart(ev) {
    skipIntro(); cancelCamera();
    if (ev.touches.length === 1) {
      seatTouchPan(ev.touches[0]);
      touchMoved = false;
    } else if (ev.touches.length === 2) {
      // Second finger down — hand off from pan to pinch.
      touchPanId = null;
      pinchGap = fingerGap(ev.touches[0], ev.touches[1]);
      touchMoved = true;
    }
  }

  function onTouchMove(ev) {
    var touches = ev.touches;
    if (touches.length === 1 && touchPanId !== null
        && touches[0].identifier === touchPanId) {
      ev.preventDefault();
      // Same pan math as onMove: offset moves by the raw finger delta.
      var ddx = touches[0].clientX - dragStartX, ddy = touches[0].clientY - dragStartY;
      if (Math.abs(ddx) + Math.abs(ddy) > CLICK_MOVE_THRESHOLD) touchMoved = true;
      view.offsetX = startOffsetX + ddx;
      view.offsetY = startOffsetY + ddy;
      hoverNode = null;
      tooltip.style.display = "none";
      draw();
      return;
    }
    if (touches.length === 2) {
      ev.preventDefault();
      var gap = fingerGap(touches[0], touches[1]);
      if (pinchGap > 0 && gap > 0) {
        var rect = canvas.getBoundingClientRect();
        zoomAt(
          (touches[0].clientX + touches[1].clientX) / 2 - rect.left,
          (touches[0].clientY + touches[1].clientY) / 2 - rect.top,
          gap / pinchGap
        );
      }
      pinchGap = gap;
      touchMoved = true;
    }
  }

  function onTouchEnd(ev) {
    // A pan/pinch must not also open a card: preventDefault here drops the click
    // the browser would synthesize from the touch sequence. A clean tap (never
    // moved past the threshold) is left alone, so its synthesized click reaches
    // onClick and node navigation keeps working on touch.
    if (touchMoved) ev.preventDefault();
    if (ev.touches.length === 1) {
      // A finger lifted out of a pinch — re-anchor the pan on the survivor so the
      // view doesn't jump by the old finger's offset.
      seatTouchPan(ev.touches[0]);
    } else if (ev.touches.length === 0) {
      touchPanId = null;
      pinchGap = 0;
    }
  }

  function resetView() {
    skipIntro(); cancelCamera();
    view.scale = 1; view.offsetX = 0; view.offsetY = 0;
    // BRAINMAP-FOCUS: 리셋 / dblclick release focus too — focus is a view
    // state, so "back to the whole map" must mean it.
    clearFocus(false);
    draw();
  }

  // BRAINMAP-FILTER: legend click = set/toggle the domain filter (delegated).
  // Clicking the already-active filter (or "전체 보기") restores all. Zoom/pan
  // is untouched — filtering only changes which nodes are drawn/dimmed.
  function onLegendClick(ev) {
    skipIntro();
    var btn = ev.target.closest(".key");
    if (!btn) return;
    var kind = btn.getAttribute("data-filter");
    // BRAINMAP-FOCUS: the two new keys are INDEPENDENT toggles, not members of
    // the mutually-exclusive activeFilter slot — they leave domain/market alone.
    if (kind === "nature-hide") {
      hideMarket = !hideMarket;
      // "시장·시세만 보기" and "시장·시세 숨기기" are contradictory intents; if
      // the isolate key was on, drop it rather than light an empty map.
      if (hideMarket && activeFilter && activeFilter.type === "market") activeFilter = null;
      updateLegendActive(); updateSearchCount(); draw();
      return;
    }
    if (kind === "focus-arm") {
      focusArmed = !focusArmed;
      updateLegendActive(); updateFocusChip();
      return;
    }
    var next = null;
    if (kind === "domain") next = { type: "domain", value: btn.getAttribute("data-domain") };
    else if (kind === "market") {
      next = { type: "market" };
      // Mirror of the reconciliation above: isolating 시장·시세 while hiding it
      // would light nothing, so the hide toggle yields to the newer intent.
      hideMarket = false;
    }
    // "전체 보기" is the existing restore-all key — it now also releases focus.
    else if (kind === "all") clearFocus(false);
    // Toggle off when re-clicking the active filter -> back to "전체 보기".
    if (next && activeFilter && next.type === activeFilter.type &&
        (next.type !== "domain" || next.value === activeFilter.value)) {
      next = null;
    }
    activeFilter = next;
    updateLegendActive();
    hoverNode = null;
    tooltip.style.display = "none";
    // BRAINMAP-FEATURES: the composed (domain AND spread AND search) lit set
    // changed — refresh the live search count too.
    updateSearchCount();
    draw();
  }

  function updateLegendActive() {
    var keys = document.querySelectorAll("#legend .key");
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], kind = k.getAttribute("data-filter"), on = false;
      if (kind === "nature-hide") on = hideMarket;
      else if (kind === "focus-arm") on = focusArmed;
      else if (!activeFilter) on = (kind === "all");
      else if (activeFilter.type === "market") on = (kind === "market");
      else on = (kind === "domain" && k.getAttribute("data-domain") === activeFilter.value);
      if (on) k.classList.add("active"); else k.classList.remove("active");
    }
  }

  // BRAINMAP-FEATURES: live search count — over the FULLY COMPOSED active set
  // (domain AND spread AND search), i.e. exactly the nodes currently lit.
  // "연결됨" = the node has at least one edge (hasEdgeById).
  function updateSearchCount() {
    var el = document.getElementById("searchCount");
    if (!el) return;
    if (!searchQuery) { el.textContent = ""; return; }
    var total = 0, connected = 0;
    graph.nodes.forEach(function (n) {
      if (!isActive(n)) return;
      total += 1;
      if (hasEdgeById[n.id]) connected += 1;
    });
    el.textContent = total + "건 일치 · 그중 " + connected + "건 연결됨";
  }

  // BRAINMAP-FEATURES: center+zoom on one node — the SAME math as the
  // ?focus=<id> deep-link path (scale 2.5, node at viewport center).
  // BRAINMAP-ATMOSPHERE: entry animation — ARRIVAL, never a different layout.
  // Nodes interpolate from the canvas centre to their true precomputed
  // coordinates over INTRO_MS; any deliberate interaction cuts straight to
  // the final state; it never re-runs (filter changes included); skipped
  // entirely under prefers-reduced-motion.
  function runIntro() {
    if (intro.done || reducedMotion) { intro.done = true; return; }
    intro.active = true;
    var t0 = 0;
    function tick(now) {
      if (!intro.active) return;
      if (!t0) t0 = now;
      var t = Math.min(1, (now - t0) / INTRO_MS);
      intro.ease = 1 - Math.pow(1 - t, 3);   // ease-out cubic
      draw();
      if (t < 1) intro.raf = requestAnimationFrame(tick);
      else skipIntro();
    }
    intro.raf = requestAnimationFrame(tick);
  }

  function skipIntro() {
    intro.done = true;
    if (!intro.active) return;
    intro.active = false;
    intro.ease = 1;
    try { cancelAnimationFrame(intro.raf); } catch (e) { /* stub-safe */ }
    draw();
  }

  // Eased camera for search centring. Interruptible: any pan/zoom/touch
  // cancels mid-flight and the view stays exactly where it was.
  function cancelCamera() {
    if (!camAnim) return;
    try { cancelAnimationFrame(camAnim.raf); } catch (e) { /* stub-safe */ }
    camAnim = null;
  }

  function animateViewTo(scale, ox, oy) {
    cancelCamera();
    if (reducedMotion) {
      view.scale = scale; view.offsetX = ox; view.offsetY = oy;
      draw();
      return;
    }
    var s0 = view.scale, x0 = view.offsetX, y0 = view.offsetY, t0 = 0;
    var anim = { raf: 0 };
    camAnim = anim;
    function tick(now) {
      if (camAnim !== anim) return;   // interrupted — stay where we are
      if (!t0) t0 = now;
      var t = Math.min(1, (now - t0) / CAM_MS);
      var k = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      view.scale = s0 + (scale - s0) * k;
      view.offsetX = x0 + (ox - x0) * k;
      view.offsetY = y0 + (oy - y0) * k;
      draw();
      if (t < 1) anim.raf = requestAnimationFrame(tick);
      else camAnim = null;
    }
    anim.raf = requestAnimationFrame(tick);
  }

  function centerOnNode(n) {
    var rect = canvas.parentElement.getBoundingClientRect();
    var fw = Math.max(320, rect.width), fh = Math.max(280, rect.height);
    var fp = positions[n._i];
    hoverNode = n;
    tooltip.style.display = "none";
    // BRAINMAP-ATMOSPHERE: glide to the target instead of jumping. Same
    // destination as before (scale 2.5, node centred) — only the transition.
    animateViewTo(2.5, fw / 2 - fp.px * 2.5, fh / 2 - fp.py * 2.5);
  }

  // BRAINMAP-FEATURES: search input — lightly debounced; ENTER jumps to the
  // first node passing ALL active conditions. Clearing restores per the other
  // active filters (domain/spread stay in force).
  var searchDebounce = null;
  function onSearchInput(ev) {
    skipIntro();
    var q = String(ev.target.value || "").trim().toLowerCase();
    if (searchDebounce) clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () {
      searchQuery = q;
      hoverNode = null;
      tooltip.style.display = "none";
      updateSearchCount();
      draw();
    }, 120);
  }

  function onSearchKeydown(ev) {
    skipIntro();
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    // Apply any pending debounced value immediately, then jump.
    searchQuery = String(ev.target.value || "").trim().toLowerCase();
    updateSearchCount();
    if (!searchQuery) { draw(); return; }
    for (var i = 0; i < graph.nodes.length; i++) {
      if (isActive(graph.nodes[i])) { centerOnNode(graph.nodes[i]); return; }
    }
    draw(); // no match — just repaint dimmed state
  }

  // BRAINMAP-FEATURES: spread-size dropdown (cluster outlet_count threshold).
  function onSpreadChange(ev) {
    skipIntro();
    spreadMin = Number(ev.target.value) || 0;
    hoverNode = null;
    tooltip.style.display = "none";
    updateSearchCount();
    draw();
  }

  // BRAINMAP-FEATURES: one-pass FULL-graph stats (never the filtered view):
  // 노드/연결(edges)/클러스터 counts + connected-vs-isolated by the has-an-edge
  // definition, + largest cluster's outlet count. Circulation vocabulary only.
  function renderStats() {
    var el = document.getElementById("mapStats");
    if (!el) return;
    var connected = 0;
    graph.nodes.forEach(function (n) { if (hasEdgeById[n.id]) connected += 1; });
    var isolated = graph.nodes.length - connected;
    var maxOutlets = 0;
    (graph.clusters || []).forEach(function (c) {
      if (c.outlet_count > maxOutlets) maxOutlets = c.outlet_count;
    });
    el.textContent = "노드 " + graph.nodes.length + "개 · 연결 " + graph.edges.length
      + "개 · 클러스터 " + (graph.clusters || []).length
      + "개 · 연결된 노드 " + connected + "개 · 미연결 " + isolated + "개"
      + (maxOutlets > 0 ? " · 최대 확산 " + maxOutlets + "개 매체" : "");
  }

  function onClick(ev) {
    skipIntro();
    // A drag past the threshold was a pan, not a click — do not navigate.
    if (dragDist > CLICK_MOVE_THRESHOLD) { dragDist = 0; return; }
    var rect = canvas.getBoundingClientRect();
    var n = nearestNode(ev.clientX - rect.left, ev.clientY - rect.top);
    if (!n) return;
    // BRAINMAP-FOCUS: a MODIFIED click (or an armed one-shot tap) focuses the
    // node's cluster; a plain click still opens the card exactly as before, so
    // the card is no further away than it was.
    if (ev.shiftKey || ev.altKey || ev.metaKey || focusArmed) {
      setFocus(n);
      return;
    }
    if (n.id) window.location.href = "/?result_id=" + encodeURIComponent(n.id);
  }

  // BRAINMAP-FOCUS: focus one cluster. An UNCLUSTERED node (9,678 of them) has
  // no constellation to isolate, so focusing it would dim the entire map to a
  // single dot and read as "this one matters". We decline and say why instead —
  // having no cluster is the corpus's most common state, not an error.
  function setFocus(n) {
    var cid = (n && n.cluster_id !== null && n.cluster_id !== undefined)
      ? n.cluster_id : null;
    if (cid === null) {
      focusArmed = false;
      updateLegendActive();
      showFocusNote("이 점은 아직 다른 기사와 연결되지 않아 집중할 묶음이 없습니다.");
      return;
    }
    focusCluster = cid;
    focusArmed = false;   // one-shot: a plain tap opens cards again
    hoverNode = null;
    tooltip.style.display = "none";
    updateLegendActive();
    updateFocusChip();
    updateSearchCount();
    draw();
  }

  // `redraw` false when the caller repaints itself (legend click path).
  function clearFocus(redraw) {
    if (focusCluster === null && !focusArmed) return;
    focusCluster = null;
    focusArmed = false;
    updateLegendActive();
    updateFocusChip();
    updateSearchCount();
    if (redraw !== false) draw();
  }

  function showFocusNote(text) {
    var el = document.getElementById("focusChip");
    if (!el) return;
    el.textContent = text;
    el.style.display = "";
    el.disabled = true;
    if (focusNoteTimer) clearTimeout(focusNoteTimer);
    focusNoteTimer = setTimeout(function () { updateFocusChip(); }, 3200);
  }

  function updateFocusChip() {
    var el = document.getElementById("focusChip");
    if (!el) return;
    if (focusNoteTimer) { clearTimeout(focusNoteTimer); focusNoteTimer = null; }
    el.disabled = false;
    if (focusCluster !== null) {
      var c = clusterById[focusCluster];
      // size_label is the builder's own circulation string ("N개 매체 보도 중").
      el.textContent = "집중 해제" + (c && c.size_label ? " · " + c.size_label : "");
      el.style.display = "";
    } else if (focusArmed) {
      el.textContent = "집중할 묶음을 탭하세요 · 취소";
      el.style.display = "";
    } else {
      el.style.display = "none";
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function start(data) {
    if (!data || data.empty === true || !data.nodes || data.nodes.length === 0) {
      statusEl.textContent = "지도가 아직 생성되지 않았습니다.";
      return;
    }
    graph = data;
    graph.nodes.forEach(function (n, i) { n._i = i; nodeById[n.id] = n; });
    (graph.clusters || []).forEach(function (c) { clusterById[c.cluster_id] = c; });
    // BRAINMAP-FEATURES: has-an-edge index (drives the 연결됨 count + stats).
    graph.edges.forEach(function (e) {
      hasEdgeById[e.src] = true;
      hasEdgeById[e.dst] = true;
    });
    statusEl.style.display = "none";
    buildLegend(graph.nodes);
    renderStats();
    document.getElementById("legend").addEventListener("click", onLegendClick);
    // BRAINMAP-FEATURES: search + spread controls.
    var searchEl = document.getElementById("mapSearch");
    if (searchEl) {
      searchEl.addEventListener("input", onSearchInput);
      searchEl.addEventListener("keydown", onSearchKeydown);
    }
    var spreadEl = document.getElementById("spreadFilter");
    if (spreadEl) spreadEl.addEventListener("change", onSpreadChange);
    layout();
    // BRAINMAP-ATMOSPHERE: arrive. Runs once per page load; a ?focus= deep
    // link (below) skips it so the linked node is centred immediately.
    runIntro();
    if (!intro.active) draw();
    canvas.style.cursor = "grab";
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mousedown", onDown);
    window.addEventListener("mouseup", onUp);
    canvas.addEventListener("mouseleave", function () {
      hoverNode = null; tooltip.style.display = "none"; draw();
    });
    canvas.addEventListener("click", onClick);
    canvas.addEventListener("wheel", onWheel, { passive: false });
    canvas.addEventListener("dblclick", resetView);
    // MOBILE-POLISH H: touch pan/pinch. passive:false — every one of these calls
    // preventDefault on a real gesture, which a passive listener may not do.
    canvas.addEventListener("touchstart", onTouchStart, { passive: false });
    canvas.addEventListener("touchmove", onTouchMove, { passive: false });
    canvas.addEventListener("touchend", onTouchEnd, { passive: false });
    canvas.addEventListener("touchcancel", onTouchEnd, { passive: false });
    var resetBtn = document.getElementById("resetView");
    if (resetBtn) resetBtn.addEventListener("click", resetView);
    // BRAINMAP-FOCUS: the chip clears focus (or cancels a waiting arm).
    var focusBtn = document.getElementById("focusChip");
    if (focusBtn) focusBtn.addEventListener("click", function () { clearFocus(true); });
    // Escape releases focus, matching 리셋 / dblclick. Ignored while the search
    // box has the caret so Escape can still clear the query first.
    window.addEventListener("keydown", function (ev) {
      // BRAINMAP-ATMOSPHERE: any keypress is deliberate input — settle now.
      skipIntro();
      if (ev.key !== "Escape") return;
      if (focusCluster === null && !focusArmed) return;
      if (document.activeElement && document.activeElement.id === "mapSearch") return;
      clearFocus(true);
    });
    // BRAINMAP-HOVER A8: ?focus=<result_id> (from the card's 브레인맵에서 유사
    // 보도 보기 link) lands centered + hovered on that card's node, reusing the
    // existing view/hoverNode/draw machinery. Node ids ARE result ids (see
    // onClick). Fail-silent when the id is absent or not in the graph (old
    // card / rebuilt graph) — the map just shows the default view.
    try {
      var focusId = new URLSearchParams(window.location.search).get("focus");
      var focusNode = focusId !== null ? nodeById[focusId] : null;
      if (focusNode) {
        // BRAINMAP-ATMOSPHERE: a deep link means "show me THIS node" — the
        // entry animation would delay that, so settle instantly instead.
        skipIntro();
        var rect = canvas.parentElement.getBoundingClientRect();
        var fw = Math.max(320, rect.width), fh = Math.max(280, rect.height);
        var fp = positions[focusNode._i];
        view.scale = 2.5;
        view.offsetX = fw / 2 - fp.px * view.scale;
        view.offsetY = fh / 2 - fp.py * view.scale;
        hoverNode = focusNode;
        draw();
        // Same tooltip markup onMove builds, anchored beside the centered node.
        var fspread = "";
        if (focusNode.cluster_id !== null && focusNode.cluster_id !== undefined && clusterById[focusNode.cluster_id]) {
          fspread = '<div class="tip-spread">' + clusterById[focusNode.cluster_id].size_label + "</div>";
        }
        tooltip.innerHTML = escapeHtml(focusNode.title || "(제목 없음)") + fspread;
        tooltip.style.display = "block";
        tooltip.style.left = Math.max(4, Math.min(fw / 2 + 14, fw - 330)) + "px";
        tooltip.style.top = (fh / 2 + 14) + "px";
      }
    } catch (e) { /* focus is optional — never break the map */ }
    // Resize: re-fit the world layer to the new viewport; preserve the
    // current pan/zoom transform on top (a sensible, non-jarring default).
    window.addEventListener("resize", function () { layout(); draw(); });
  }

  fetch("/api/brainmap")
    .then(function (r) {
      if (!r.ok) throw new Error("bad status " + r.status);
      return r.json();
    })
    .then(start)
    .catch(function () {
      statusEl.textContent = "지도를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
    });
})();
</script>
</body>
</html>
