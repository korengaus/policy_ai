<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스 연결지도 — tickedin</title>
<!-- LINK-PREVIEW: OG/Twitter tags mirror frontend/template.html's set. Spread/
     connection vocabulary only (유통/연결/확산) — no verdict words, no counts.
     Canonical URL has no query parameters. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="tickedin">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://tickedin.org/web/brainmap.html">
<meta property="og:title" content="뉴스 연결지도 — tickedin">
<meta property="og:description" content="정책 뉴스가 매체 사이에서 어떻게 유통되고 연결되는지 보여주는 뉴스 연결지도. 유통·연결을 보여주며 검증이 아닙니다.">
<meta property="og:image" content="https://tickedin.org/web/assets/og-brainmap.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="tickedin 뉴스 연결지도 — 뉴스의 유통·연결을 보여주는 지도">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="뉴스 연결지도 — tickedin">
<meta name="twitter:description" content="정책 뉴스가 매체 사이에서 어떻게 유통되고 연결되는지 보여주는 뉴스 연결지도. 유통·연결을 보여주며 검증이 아닙니다.">
<meta name="twitter:image" content="https://tickedin.org/web/assets/og-brainmap.png">
<!--
  BRAINMAP 2d-ii — standalone, hand-authored page (NOT build_index-managed;
  touches none of the index pins). Fetches GET /api/brainmap (the newest
  brainmap_graph row) and renders the 유통/연결 (spread/connection) graph on a
  single canvas. VERDICT-ISOLATED: this page shows NO verdict — cluster labels
  render the stored "N개 매체 보도 중" (spread) verbatim; a node click links
  BACK to its verification card (/?result_id=N) where verification lives.
  Self-contained: inline CSS + JS, no external lib/CDN.
-->
<style>
  /* BRAINMAP-COHESION: tokens mirrored from the main site's design system
     (frontend/styles/main.css :root) so this standalone page reads as tickedin.
     Values copied, not linked — the page stays self-contained (no CDN). */
  /* BRAINMAP-ATMOSPHERE: this page moves to a dark canvas so the domain
     colours read as points of light. Tokens are PAGE-LOCAL (copied, never
     linked) — the home page keeps its light, restrained treatment untouched.
     Encodings are unchanged: x/y = embedding location, size = outlet count,
     colour = domain. Only the atmosphere changes. */
  :root {
    /* 66-APPLY: synced to the design system's DARK-FIELD companions
       (main.css --dark-field / --df-*) — the map stays dark, but on the
       system's warm dark field instead of the cool navy. --paper and --line
       have no dark tokens in the system: they are derived one tone off the
       field (04's elevation-by-tone rule) and disclosed here. */
    color-scheme: dark;      /* native form controls (select) match the page */
    --ink: #eceae4;          /* df-text (12.9:1 on the field) */
    --slate: #b9beb8;        /* df-meta (7.6:1) */
    --muted: #b9beb8;        /* collapsed into df-meta — no third dark step exists */
    --line: #2e333b;         /* derived dark hairline (one tone above the field) */
    --paper: #1e232b;        /* derived L1 surface (one tone above the field) */
    --canvas: #161a21;       /* the system's dark field */
    --brand: #a9c0ec;        /* df-link */
    --brand-ink: #8fa5d4;    /* df-node — hover / active */
    --shadow: 0 8px 24px rgba(2, 6, 16, 0.55);
    --radius-sm: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    /* Site body font stack (Pretendard on the main site; graceful Korean
       system fallbacks here — no CDN font load on this standalone page). */
    font-family: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column;
  }
  header.map-head {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px 12px;
    flex: 0 0 auto;
  }
  /* tickedin identity row — mirrors the site's .brand treatment (favicon mark +
     serif wordmark). The wordmark links home. */
  .brand-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); text-decoration: none;
    font-family: 'Noto Serif KR', 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
    font-size: 21px; font-weight: 700; letter-spacing: -0.01em;
  }
  .brand img { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: middle; }
  .brand-page-label {
    color: var(--muted); font-size: 13px; font-weight: 600;
    padding-left: 12px; border-left: 1px solid var(--line);
  }
  .map-home {
    margin-left: auto; font-size: 13px; font-weight: 600;
    color: var(--brand-ink); text-decoration: none;
  }
  .map-home:hover { text-decoration: underline; }
  .map-reset {
    /* BRAINMAP-FEATURES: margin-left:auto moved to .map-search so the whole
       search+count+spread+리셋 group right-aligns together. */
    font-size: 12.5px; font-weight: 600; padding: 4px 12px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper); color: var(--slate); cursor: pointer;
    font-family: inherit;
  }
  .map-reset:hover { color: var(--ink); border-color: var(--muted); }
  /* BRAINMAP-FOCUS: the focus chip is the 리셋 button's chrome with the brand
     accent, so an active focus is visible without inventing a new control
     language. Not a data encoding — a UI state. */
  .map-focus { border-color: var(--brand); color: var(--brand-ink); background: #142642; }
  .map-focus[disabled] { border-color: var(--line); color: var(--slate); background: var(--paper); cursor: default; }
  /* BRAINMAP-FEATURES: search input + spread dropdown share the 리셋 button's
     calm chrome (site tokens). The count is a muted live annotation. */
  .map-search {
    margin-left: auto;
    font-size: 12.5px; padding: 4px 12px; width: 170px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper); color: var(--ink); font-family: inherit;
  }
  .map-search:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .search-count { font-size: 12px; color: var(--slate); white-space: nowrap; }
  /* BRAINMAP-SEARCH-NAV: step through the matches. Reuses the 리셋 button's
     chrome — no new control language, no new dependency. Lives in the same
     wrapping .head-row as the other controls, so on a narrow screen it reflows
     onto its own line exactly like the focus chip. The buttons are 34px in
     BOTH axes (comfortably over the 24px CSS-px tap floor) because a phone has
     neither an Enter key in view nor arrow keys — the visible control is the
     ONLY route there. */
  .search-nav { display: none; align-items: center; align-self: center; gap: 4px; }
  .nav-step {
    font-size: 16px; line-height: 1; font-weight: 700;
    min-width: 34px; min-height: 34px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper); color: var(--slate); cursor: pointer;
    font-family: inherit;
  }
  .nav-step:hover:not([disabled]) { color: var(--ink); border-color: var(--muted); }
  .nav-step:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  /* Disabled reads as a dimmer INK, never a lower opacity — opacity encodes
     nothing on this page and must keep encoding nothing. */
  .nav-step[disabled] { opacity: 1; color: #46536b; cursor: default; }
  .nav-pos {
    font-size: 12.5px; font-weight: 700; color: var(--brand-ink);
    min-width: 60px; text-align: center; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  /* The order is a FACT about the list, not a ranking — said out loud, next to
     the position, so "1 / 123" cannot be read as "the most relevant". */
  .nav-note { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .map-spread {
    font-size: 12.5px; font-weight: 600; padding: 4px 8px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper); color: var(--slate); cursor: pointer;
    font-family: inherit;
  }
  .map-spread:hover { color: var(--ink); border-color: var(--muted); }
  .map-stats { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .head-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .map-title {
    font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink);
    /* FONT-SWITCH: page title joins the body sans stack; only .brand stays serif. */
    font-family: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  }
  /* HONESTY (fixed, always visible): this map is spread/connection, NOT verification. */
  .map-subtitle { margin-top: 4px; font-size: 13.5px; line-height: 1.55; color: var(--slate); }
  .map-subtitle strong { color: var(--ink); font-weight: 700; }
  .legend {
    margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px 16px;
    font-size: 12.5px; color: var(--slate); align-items: center;
  }
  /* BRAINMAP-FILTER: legend keys are interactive filter toggles. They read as
     calm tappable chips (site tokens), with a clear active state. Clicking a
     domain isolates its constellation; "전체 보기" restores all. */
  .legend .key {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: inherit; font-size: 12.5px; color: var(--slate);
    background: transparent; border: 1px solid transparent; border-radius: 0;
    padding: 4px 8px; cursor: pointer; line-height: 1.15;
    transition: background .12s, border-color .12s, color .12s;
  }
  /* BRAINMAP-MULTI-DOMAIN: on TOUCH pointers only, the chips grow to a real tap
     target. Measured at 320/360/390px the legend chip was 22.4px tall — under
     any tap-target floor — which mattered little when a reader tapped ONE
     domain and matters a lot now that building a combination means tapping
     several in a row. Gated on (pointer: coarse), so the desktop legend is
     byte-identical to what it was. Padding only: no size or opacity encoding
     is involved, and the twelve chips still wrap in the same order. */
  @media (pointer: coarse) {
    .legend .key { padding: 8px 12px; }
    .legend { gap: 8px 12px; }
  }
  .legend .key:hover { background: #17233a; border-color: var(--line); color: var(--ink); }
  .legend .key:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .legend .key.active {
    background: #142642; border-color: var(--brand); color: var(--brand-ink); font-weight: 700;
  }
  /* BRAINMAP-MULTI-DOMAIN: the selected mark. A CHECKMARK plus the existing
     active chrome (filled ground, brand border, brand ink, bold) — never
     opacity, which encodes nothing on this page, and never size, which encodes
     outlet count. The span keeps its 9px whether or not it holds the glyph, so
     toggling a domain cannot reflow the twelve chips or make a selected chip
     read as bigger. */
  .legend .key .tick {
    display: inline-block; width: 9px; text-align: center;
    font-size: 11.5px; font-weight: 700; line-height: 1; color: var(--brand-ink);
  }
  /* The chip order is corpus volume, stated so a multi-selection row cannot be
     read as a priority list. Same disclosure the search stepper makes. */
  .legend-note { font-size: 11.5px; color: var(--muted); }
  .legend .dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  }
  .legend .dot.hollow { background: transparent !important; border: 2px solid #8b9cb6; }
  main.map-body { position: relative; flex: 1 1 auto; min-height: 0; }
  /* MOBILE-POLISH H: touch-action:none is what lets the touch handlers below see a
     coherent gesture — the default (auto) hands one-finger drags and pinches to the
     browser as page scroll/zoom before any JS runs, so the graph could never pan or
     pinch on a phone. No effect on mouse input. */
  canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
  /* Tooltip as a light site-style card (paper surface, line border, soft shadow). */
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    max-width: 320px; padding: 8px 12px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-size: 12.5px; line-height: 1.5;
    box-shadow: var(--shadow); z-index: 5;
  }
  #tooltip .tip-spread { color: var(--brand-ink); margin-top: 4px; font-size: 12px; font-weight: 600; }
  #status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--slate); font-size: 15px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<header class="map-head">
  <!-- BRAINMAP-COHESION: tickedin identity row — the site's wordmark (favicon
       mark + serif "tickedin", same treatment as the main header's .brand),
       linking home, with the page label + return link. -->
  <div class="brand-row">
    <a class="brand" href="/" aria-label="tickedin 홈으로"><img src="/web/assets/favicon-180.png" alt="" aria-hidden="true">tickedin</a>
    <span class="brand-page-label">연결지도</span>
    <a class="map-home" href="/">← 홈으로</a>
  </div>
  <div class="head-row">
    <span class="map-title">뉴스 연결지도</span>
    <!-- BRAINMAP-FEATURES: keyword search (substring over node titles, dims
         non-matches via the SAME isActive mechanism the domain filter uses) +
         a spread-size dropdown (cluster outlet_count threshold). Circulation
         vocabulary only — 일치/연결/매체, never verdict words. -->
    <input type="search" id="mapSearch" class="map-search" placeholder="제목 검색" autocomplete="off" aria-label="노드 제목 검색">
    <span id="searchCount" class="search-count" aria-live="polite"></span>
    <!-- BRAINMAP-SEARCH-NAV: position within the results + a visible stepper.
         Shown only while a query is active. "3 / 123" is a POSITION IN A LIST,
         never a rank: the order is the graph's own node order (analysis_results
         id ascending), which carries no relevance meaning — the note beside it
         says so. -->
    <span id="searchNav" class="search-nav" style="display:none">
      <button type="button" id="searchPrev" class="nav-step" aria-label="이전 일치 항목으로">‹</button>
      <span id="searchPos" class="nav-pos" aria-live="polite" aria-atomic="true"></span>
      <button type="button" id="searchNext" class="nav-step" aria-label="다음 일치 항목으로">›</button>
      <span class="nav-note">수록 순 · 관련도순 아님</span>
    </span>
    <select id="spreadFilter" class="map-spread" aria-label="확산 규모 필터">
      <option value="0" selected>확산 규모: 전체</option>
      <option value="3">3개 매체 이상 보도</option>
      <option value="5">5개 매체 이상 보도</option>
      <option value="10">10개 매체 이상 보도</option>
    </select>
    <!-- BRAINMAP-FOCUS: appears only while a cluster is focused (or the
         one-shot arm is waiting). Lives in the same wrapping flex row as the
         other controls, so it reflows onto its own line on a narrow screen. -->
    <button type="button" id="focusChip" class="map-reset map-focus" style="display:none"></button>
    <button type="button" id="resetView" class="map-reset">리셋</button>
  </div>
  <p class="map-subtitle">
    이 지도는 뉴스의 <strong>유통·연결</strong>을 보여줍니다. <strong>검증이 아닙니다.</strong>
    가까이 모인 점은 비슷한 내용이 여러 매체에 보도되었다는 뜻일 뿐, 사실 여부와는 무관합니다.
  </p>
  <div class="legend" id="legend" aria-label="범례"></div>
  <!-- BRAINMAP-FEATURES: one-line numeric stats over the FULL loaded graph
       (not the filtered view) — circulation counts only. -->
  <div class="map-stats" id="mapStats"></div>
</header>
<main class="map-body">
  <canvas id="map"></canvas>
  <div id="status">지도를 불러오는 중…</div>
  <div id="tooltip"></div>
</main>
<script>
(function () {
  "use strict";

  // Fixed categorical palette per domain. BRAINMAP-ATMOSPHERE: the same HUE
  // per domain as the original light-bg palette, lifted in lightness so the
  // points read as lights on the dark canvas. The ENCODING (domain -> hue
  // family) is unchanged — only luminance moved with the background.
  var DOMAIN_COLORS = {
    "finance":      "#5aa2e8",
    "welfare":      "#e0a84a",
    "agriculture":  "#55c088",
    "labor":        "#cf8a3d",
    "health":       "#ef6a6a",
    "environment":  "#4fc0c2",
    "SMB":          "#a789ec",
    "realestate":   "#e86ab4",
    "statistics":   "#93a3ba",
    "education":    "#8b90ef",
    "scitech":      "#38b6d8",
    "trade":        "#e0578f",
    "기타-미분류":   "#8b97a8"
  };
  var DOMAIN_KO = {
    "finance": "금융", "welfare": "복지", "agriculture": "농어업",
    "labor": "고용·노동", "health": "보건", "environment": "환경",
    "SMB": "소상공인·중기", "realestate": "부동산", "statistics": "통계",
    "education": "교육",
    "scitech": "과학기술", "trade": "산업·통상",
    "기타-미분류": "기타"
  };
  var FALLBACK_COLOR = "#98a2b3";
  var PAD = 40;             // canvas margin (px)
  var HIT_RADIUS = 9;       // hover hit-test radius (px)
  var LABEL_TOP_N = 12;     // clusters drawn with an always-on label
  var LABEL_MIN_SIZE = 5;

  var canvas = document.getElementById("map");
  var ctx = canvas.getContext("2d");
  var tooltip = document.getElementById("tooltip");
  var statusEl = document.getElementById("status");

  var graph = null;         // {nodes, edges, clusters}
  var nodeById = {};        // id -> node
  var clusterById = {};     // cluster_id -> cluster meta
  var positions = [];       // per node: {px, py} in CSS pixels
  var labelSpots = [];      // top-cluster label placements
  var hoverNode = null;

  // BRAINMAP-FILTER: client-side domain filter over the already-loaded nodes
  // (no new fetch, no data change).
  // BRAINMAP-MULTI-DOMAIN: the single {type,value} slot became a SET of domain
  // values, so 교육 and 복지 can be read together. Everything else about the
  // filter is unchanged — same client-side dimming, same AND chain, no fetch.
  //   domainSel  : selected domain values. EMPTY = no domain condition (every
  //                domain lit), which is the state 전체 보기 shows as active.
  //                Empty and all-twelve-selected produce the same lit set but
  //                are DIFFERENT STATES and are shown differently (see
  //                updateLegendActive): empty lights 전체 보기, all-twelve
  //                lights twelve ticked chips. Order is meaningless here — it
  //                is a set, never a ranking, and selected chips are never
  //                promoted or reordered in the legend.
  //   marketOnly : the 시장·시세 소식(빈 점) isolate. Kept MUTUALLY EXCLUSIVE
  //                with domainSel exactly as the old single slot was, so no
  //                existing combination changes meaning.
  //   multiSelectMode : an INPUT MODE, not a filter. While on, a plain tap
  //                toggles a domain instead of switching to it — the touch
  //                route to multi-select, mirroring the existing focus-arm
  //                chip (a phone has no Ctrl/⌘/Shift). Off by default, so a
  //                plain click keeps its current meaning byte for byte.
  var domainSel = [];
  var marketOnly = false;
  var multiSelectMode = false;
  // BRAINMAP-FEATURES: two ADDITIONAL client-side conditions that compose with
  // the domain filter via AND in isActive — a node stays lit only if it passes
  // ALL active conditions. Circulation-only (title match / cluster outlet
  // count); never verdict-based.
  var searchQuery = "";     // lowercased substring over node.title ("" = off)
  var spreadMin = 0;        // min cluster outlet_count (0 = off)
  var hasEdgeById = {};     // node id -> true when the node has >=1 edge
  // BRAINMAP-FOCUS: two more conditions on the SAME AND chain in isActive.
  // Neither adds a filtering path, a fetch, or a payload field — cluster_id
  // and content_nature are already on every node.
  //   focusCluster: a cluster_id whose constellation stays lit while the rest
  //     of the map dims. null = off.
  //   focusArmed: one-shot mode so a TAP can focus on touch, where there is no
  //     modifier key. Disarms itself after one focus so a plain tap goes back
  //     to opening the card — the mode can never get stuck on.
  //   hideMarket: hides 시장·시세 items (content_nature === market_commercial).
  var focusCluster = null;
  var focusArmed = false;
  var hideMarket = false;
  var focusNoteTimer = null;

  function anyFilterActive() {
    return domainSel.length > 0 || marketOnly || searchQuery !== "" || spreadMin > 0
      || focusCluster !== null || hideMarket;
  }

  // View transform (pan/zoom). Screen = world * scale + offset. Initial
  // {1, 0, 0} is byte-identical to the original static fit-to-viewport view.
  // `positions` / `labelSpots` remain the WORLD layer; this rides on top so
  // node radii, line widths, and label fonts stay constant in SCREEN pixels
  // at any zoom, and the hover hit test uses a constant screen-px radius.
  var view = { scale: 1, offsetX: 0, offsetY: 0 };

  // BRAINMAP-3D-VIEW: DISPOSABLE comparison mode (decision by 8/1; if 3D
  // loses it is deleted). Default is ALWAYS 2D — mode3d flips only via the
  // legend chip. The 3D pass projects the builder's x3/y3/z3 with an
  // ORTHOGRAPHIC camera (no perspective scaling: size = outlet count; no
  // depth fade: opacity encodes nothing). z is layout, never a variable.
  var mode3d = false;
  var has3d = false;          // payload carries x3/y3/z3 (older rows do not)
  var ROT0 = { yaw: -0.30, pitch: 0.22 };  // gentle initial tilt (unchanged)
  var drawOrder = null;       // far-to-near node order (3D only; null in 2D)
  var dragRotating = false;   // current drag is a rotation (3D, no pan modifier)

  // BRAINMAP-3D-DEPTH: depth-sorted paint buckets so EDGES interleave with
  // nodes instead of all being flushed underneath them. Node depth order was
  // already correct (drawOrder); edges were not — every edge drew behind every
  // node, so an edge passing in FRONT of a node looked like it passed behind.
  // Buckets (not a full per-primitive sort) keep the batched stroke: one
  // beginPath/stroke per bucket, far to near, with that bucket's nodes stamped

        // The index tiebreak is what makes this EXACTLY the full sort's output
        // rather than merely a correct one. Array.prototype.sort is stable, so
        // sorting [0..n-1] by depth leaves exactly-equal depths in ascending
        // index order; matching that here means the two algorithms agree on
        // every input, ties included, and the paint order can never diverge.
        while (j >= 0 && (depth[order[j]] > dv
                          || (depth[order[j]] === dv && order[j] > v))) {
          order[j + 1] = order[j];
          j--;
          if (++moves > budget) { blown = true; break; }
        }
        order[j + 1] = v;
        if (blown) break;
      }
      if (!blown) return order;
    }
    var fresh = new Array(n);
    for (i = 0; i < n; i++) fresh[i] = i;
    fresh.sort(function (a, b) { return depth[a] - depth[b]; });
    return fresh;
  }

  function layout() {
    var rect = canvas.parentElement.getBoundingClientRect();
    var w = Math.max(320, rect.width), h = Math.max(280, rect.height);
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (mode3d && has3d) {
      // BRAINMAP-3D-VIEW: rotate the x3/y3/z3 cube about its centre (yaw
      // around the vertical axis, then pitch), project orthographically,
      // and fit with a FIXED scale so rotation never rescales the cloud.
      // `positions` stays the single world layer — every consumer (draw,
      // hit-test, hover, centring, labels) reads projected coordinates and
      // works unchanged. Depth exists ONLY as paint order (far-to-near).
      // BRAINMAP-3D-CONTROLS: one matrix multiply per node (was inline
      // yaw/pitch trig) — same cost, arbitrary axes.
      var m = rotM;
      // Fixed fit: a unit cube's rotated extent never exceeds sqrt(3)/2
      // from centre; 1.28 ~= a snug constant frame at every angle.
      var s3 = Math.min(w, h - PAD) / 1.28;
      var cxs = w / 2, cys = h / 2;
      // BRAINMAP-3D-FREE-WINS (4/4): the projection still runs every rotation
      // frame — it must, the numbers change — but its ALLOCATION does not.
      // `positions` used to mint 14,225 fresh {px,py} objects per frame; the
      // slots are now reused and overwritten. Same arithmetic in the same
      // order, so the coordinates are bit-identical; only the garbage is gone.
      var nCount = graph.nodes.length;
      var depth = depthBuf(nCount);
      var pos = positionSlots(nCount);
      for (var pi = 0; pi < nCount; pi++) {
        var pn = graph.nodes[pi];
        var vx = pn.x3 - 0.5, vy = pn.y3 - 0.5, vz = pn.z3 - 0.5;
        var rx = m[0] * vx + m[1] * vy + m[2] * vz;
        var ry = m[3] * vx + m[4] * vy + m[5] * vz;
        depth[pi] = m[6] * vx + m[7] * vy + m[8] * vz;
        pos[pi].px = cxs + rx * s3;
        pos[pi].py = cys + ry * s3;
      }
      positions = pos;
      // Far-to-near paint order: nearer nodes occlude farther ones — the
      // one honest depth cue besides motion parallax. Recomputed only when
      // rotation/layout changes, not on pan/zoom frames.
      drawOrder = orderByDepth(depth, drawOrder);
      // BRAINMAP-3D-DEPTH: project the cloud's bounding sphere. Because the
      // projection is linear, the projected centre is just the centre's
      // projection, and an orthographic projection of a sphere is a circle of
      // the SAME radius at every orientation — so cloudProj.r never changes as
      // the map turns (measured: <=2.5% variation in the cloud's actual p99
      // extent across 24 random orientations, i.e. it tracks the visible edge).
      if (cloud3) {
        var qx = cloud3.cx - 0.5, qy = cloud3.cy - 0.5, qz = cloud3.cz - 0.5;
        cloudProj = {
          px: cxs + (m[0] * qx + m[1] * qy + m[2] * qz) * s3,
          py: cys + (m[3] * qx + m[4] * qy + m[5] * qz) * s3,
          r: cloud3.r * s3
        };
      }
      // BRAINMAP-3D-DEPTH: bucket nodes AND edges by depth so the draw pass can
      // interleave them. Node buckets are contiguous slices of drawOrder (it is
      // already depth-sorted); an edge takes the mean depth of its endpoints.
      // Computed here — once per rotation — so pan/zoom frames pay nothing.
      var dmin = depth[drawOrder[0]], dmax = depth[drawOrder[drawOrder.length - 1]];
      var span = (dmax - dmin) || 1;
      function bucketOf(d) {
        var b = Math.floor((d - dmin) / span * DEPTH_BUCKETS);
        return b < 0 ? 0 : (b >= DEPTH_BUCKETS ? DEPTH_BUCKETS - 1 : b);
      }
      // BRAINMAP-3D-FREE-WINS (4/4): an edge's bucket depends on depth, so the
      // GROUPING cannot be hoisted — but rebuilding 25 typed arrays and 24
      // JS arrays every frame can. The buffers are allocated once and emptied
      // in place; the contents and their order are exactly what the old code
      // produced (same scan, same push order), so the paint is identical.
      bucketNodeStart = bucketStartBuf();
      for (var bi = 0, oi = 0; bi < DEPTH_BUCKETS; bi++) {
        bucketNodeStart[bi] = oi;
        while (oi < drawOrder.length && bucketOf(depth[drawOrder[oi]]) === bi) oi++;
        bucketNodeStart[bi + 1] = oi;
      }
      bucketNodeStart[DEPTH_BUCKETS] = drawOrder.length;
      bucketEdges = bucketEdgeBuf();
      graph.edges.forEach(function (e, ei) {
        var a = nodeById[e.src], b2 = nodeById[e.dst];
        if (!a || !b2) return;
        bucketEdges[bucketOf((depth[a._i] + depth[b2._i]) / 2)].push(ei);
      });
    } else {
      drawOrder = null;
      cloudProj = null;
      bucketNodeStart = null;
      bucketEdges = null;
      // Same allocation hoist on the 2D side, same bit-identical arithmetic.
      var pos2 = positionSlots(graph.nodes.length);
      for (var qi = 0; qi < graph.nodes.length; qi++) {
        var qn = graph.nodes[qi];
        pos2[qi].px = PAD + qn.x * (w - PAD * 2);
        pos2[qi].py = PAD + qn.y * (h - PAD * 2);
      }
      positions = pos2;
    }

    // Top-N cluster label placements at each cluster's centroid.
    // BRAINMAP-3D-FREE-WINS (4/4): the MEMBERSHIP grouping and the top-N pick
    // never change while a graph is loaded, so they are built once instead of
    // per rotation frame. The centroid is still summed from the live
    // `positions` in the same order over the same members, so every anchor is
    // bit-identical to before — only the O(nodes) regrouping is gone.
    var byCluster = clusterMembers();
    var top = labelTopClusters();
    labelSpots = top.map(function (c) {
      var members = byCluster[c.cluster_id] || [];
      var cx = 0, cy = 0;
      members.forEach(function (i) { cx += positions[i].px; cy += positions[i].py; });
      var m = Math.max(1, members.length);
      var title = c.label_title || "";
      if (title.length > 20) title = title.slice(0, 20) + "…";
      return { cluster_id: c.cluster_id, x: cx / m, y: cy / m, title: title, spread: c.size_label };
    });
  }

  function draw() {
    var w = canvas.width / (window.devicePixelRatio || 1);
    var h = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);

    // BRAINMAP-ATMOSPHERE: during the entry animation nodes travel from the
    // canvas centre to their TRUE precomputed coordinates (kIntro: 0 -> 1).
    // Presentation only — kIntro ends at exactly 1, so every node lands on
    // its server-computed x/y. Never a different layout.
    var kIntro = intro.active ? intro.ease : 1;
    var icx = w / 2, icy = h / 2;
    function wx(i) { var p = positions[i]; return kIntro === 1 ? p.px : icx + (p.px - icx) * kIntro; }
    function wy(i) { var p = positions[i]; return kIntro === 1 ? p.py : icy + (p.py - icy) * kIntro; }

    // endpoints are in the active set (cross-domain edges are hidden).
    // BRAINMAP-FEATURES: "filtering" now covers domain OR search OR spread.
    var filtering = anyFilterActive();

    // only +0.95% length / +0.23pp coverage — the distance layout itself
    // tripled edge ink (327k -> 1,138k px) by drawing edges at their honest
    // similarity length. So the arc bought curvature noise without being
    // the cause, and prominence is managed below instead: thinner stroke +
    // zoom-graduated alpha. STYLE, NOT ENCODING: one width and one alpha
    // for EVERY edge at any given moment (alpha varies only with the view's
    // zoom, identically for all). Edges are never removed — faint at the
    // overview where 6,353 of them cannot be read anyway, full where zoom
    // makes them readable. Nodes are NEVER faded or hidden this way.
    // (1/4) resolve the per-combo sprites for THIS frame's radius scale. A
    // no-op unless the zoom crossed a quantised radius step.
    refreshComboSprites();

    var edgeAlpha = 0.10 + 0.06 * Math.min(1, Math.max(0, view.scale - 1));
    var edgeWidth = 0.5;
    // BRAINMAP-3D-DEPTH (Part B2): in 3D ONLY, and only ABOVE 2x, edges keep
    // strengthening as the view zooms in. Justified by count: 6,353 edges are
    // on screen at 1x and still 6,082 at 2x (so the existing ramp correctly
    // stops there), but only 3,877 at 4x and 1,488 at 8x — few enough to read.
    // A stronger edge is also what makes the in-front/behind crossing of a node
    // visible at all, which is the second depth cue. ZOOM ONLY, and IDENTICAL
    // for every edge: still similarity with no direction, no per-edge variation.
    // 2D and 3D-at-or-below-2x are byte-identical to before.
    if (mode3d && has3d) {
      var eBoost = Math.min(1, Math.max(0, (view.scale - 2) / 2));

      edgeWidth += 0.40 * eBoost;
    }
    ctx.lineWidth = edgeWidth;
    ctx.strokeStyle = "rgba(148, 170, 205, " + edgeAlpha.toFixed(3) + ")";
    // Stroke one batch of edges as a single path. `list` is an array of indexes
    // into graph.edges, or null for "every edge" (the 2D path — no allocation).
    function strokeEdges(list) {
      ctx.globalAlpha = 1;   // node stamping below leaves this at an alpha
      ctx.beginPath();
      var count = list ? list.length : graph.edges.length;
      for (var t = 0; t < count; t++) {
        var e = graph.edges[list ? list[t] : t];
        var a = nodeById[e.src], b = nodeById[e.dst];
        if (!a || !b) continue;
        if (filtering && !(isActive(a) && isActive(b))) continue;
        var ax = toScreenX(wx(a._i)), ay = toScreenY(wy(a._i));
        var bx = toScreenX(wx(b._i)), by = toScreenY(wy(b._i));
        // BRAINMAP-3D-FREE-WINS (3/4): TRIVIAL REJECT, not "both ends are off
        // screen". A segment is skipped only when both endpoints sit outside
        // the SAME edge of the viewport — the one case where the line provably
        // cannot cross it. An edge with both ends off screen on OPPOSITE sides
        // still crosses the view and is still drawn, and an edge with one end
        // inside never matches any of these four tests.
        // CULL_PAD is not cosmetic: a stroked line is WIDER than its geometry,
        // so a segment lying just past the boundary still antialiases a sliver
        // into the first pixel column. Without the pad the pixel diff caught
        // exactly one such pixel at 4x and 8x zoom. One line width plus one
        // pixel of antialias spread covers it with room to spare.
        if ((ax < -CULL_PAD && bx < -CULL_PAD) || (ax > w + CULL_PAD && bx > w + CULL_PAD)

    }
    // Stamp one node by index (shared by the 2D and the 3D interleaved pass).
    function stampNode(ni) {
      var n = graph.nodes[ni];
      if (filtering && !isActive(n)) return;
      // (1/4) sprite + alpha come from the node's combo, resolved once per
      // frame for the whole graph instead of once per node.
      var ci = nodeCombo[ni], s = comboSprite[ci];
      var sx = toScreenX(wx(ni)), sy = toScreenY(wy(ni));
      // (3/4) cull only when the sprite's FOOTPRINT is entirely outside the
      // canvas — the half-size margin is what keeps a node hanging off the
      // edge drawn, so a partially visible node never disappears. CULL_PAD on
      // top of that is pure slack.
      if (sx + s.half < -CULL_PAD || sx - s.half > w + CULL_PAD

    // deferred into the interleaved pass below so they can be occluded.
    var interleave = mode3d && has3d && drawOrder && bucketEdges && bucketNodeStart;
    if (!interleave) strokeEdges(null);

    // faint underlay — the selected set pops while its place in the whole map
    // stays visible (dim, not hide, to keep spatial context).
    if (filtering) {
      ctx.fillStyle = "#7e8ea8";
      graph.nodes.forEach(function (n, i) {
        if (isActive(n)) return;
        var dx = toScreenX(wx(i)), dy = toScreenY(wy(i));
        // (3/4) same footprint-aware cull as the sprites, at the dot's 1.8px
        // radius. A dimmed node clipped by the edge still draws.

        ctx.arc(dx, dy, 1.8, 0, Math.PI * 2);

    }

    // Radii are constant screen px (positions transform, sizes do not).
    // BRAINMAP-DEPTH-STYLE: each node is a prerendered sprite (ring + flat
    // disc) STAMPED at its unchanged coordinate — one drawImage per node
    // instead of one path-fill per node. Alphas are the pre-existing
    // interaction/visual states, byte-identical to before.
    // BRAINMAP-3D-VIEW: in 3D the pass runs FAR-TO-NEAR (drawOrder) so
    // nearer nodes occlude farther ones — geometry, not a filter; every
    // node is still stamped. In 2D drawOrder is null and order is natural.
    // BRAINMAP-3D-DEPTH: in 3D the edges ride along in the SAME far-to-near
    // sweep, one depth bucket at a time, so an edge in front of a node now
    // draws over it and an edge behind it is covered. Previously every edge
    // was flushed underneath every node, which silently threw the cue away.
    if (interleave) {
      for (var bi = 0; bi < DEPTH_BUCKETS; bi++) {

        for (var oi = bucketNodeStart[bi]; oi < bucketNodeStart[bi + 1]; oi++) {
          stampNode(drawOrder[oi]);
        }
      }
    } else {
      for (var oi2 = 0; oi2 < graph.nodes.length; oi2++) stampNode(oi2);
    }
    ctx.globalAlpha = 1;

    // BRAINMAP-SEARCH-NAV: the CURRENT match, marked with a DASHED RING at a
    // constant screen radius. Deliberately not opacity (opacity encodes nothing
    // on this page and must keep encoding nothing) and not size (size encodes
    // outlet count) — the ring is drawn OUTSIDE the node at a radius that is
    // identical for every node it ever marks, so it adds a position cue without
    // touching either encoding. Every other match stays lit exactly as before.
    // Distinct from the solid 6px hover ring by dash, radius and colour, so the
    // two can be told apart when they land on the same node. setLineDash is
    // save/restore'd — a leaked dash would reach the cluster labels' strokeText.
    if (searchMatchIndex !== null && !intro.active
        && graph.nodes[searchMatchIndex] && isActive(graph.nodes[searchMatchIndex])) {
      ctx.save();
      var cx = toScreenX(wx(searchMatchIndex)), cy = toScreenY(wy(searchMatchIndex));
      ctx.globalAlpha = 1;
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cx, cy, 11.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Hover glow + ring — marks the POINTER only, never a data value, and is
    // identical for every node it touches.
    if (hoverNode && !intro.active) {
      var hx = toScreenX(wx(hoverNode._i)), hy = toScreenY(wy(hoverNode._i));
      var glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, 16);
      glow.addColorStop(0, "rgba(158, 193, 255, 0.35)");
      glow.addColorStop(1, "rgba(158, 193, 255, 0)");
      ctx.beginPath();
      ctx.fillStyle = glow;
      ctx.arc(hx, hy, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx, hy, 6, 0, Math.PI * 2);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = "#dbe7f8";
      ctx.stroke();
    }

    // BRAINMAP-FILTER: when filtering, only label clusters that still have a
    // visible (active) member.
    var activeClusters = null;
    if (filtering) {
      activeClusters = {};
      graph.nodes.forEach(function (n) {
        if (isActive(n) && n.cluster_id !== null && n.cluster_id !== undefined) {
          activeClusters[n.cluster_id] = true;
        }
      });
    }

    // Always-on labels for the biggest clusters — stored spread label VERBATIM.
    // Font stays constant screen size; only the anchor point transforms.
    // BRAINMAP-ATMOSPHERE: labels appear once the nodes have settled (their
    // anchors are centroids of FINAL positions, so drawing them mid-flight
    // would label empty space). Halo/ink swapped for the dark canvas.
    if (intro.active) return;
    ctx.textAlign = "center";
    labelSpots.forEach(function (s) {
      if (filtering && !activeClusters[s.cluster_id]) return;
      var lx = toScreenX(s.x), ly = toScreenY(s.y);
      ctx.font = "600 12px sans-serif";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(8, 13, 24, 0.85)";
      ctx.strokeText(s.title, lx, ly - 14);
      ctx.fillStyle = "#dce6f4";
      ctx.fillText(s.title, lx, ly - 14);
      ctx.font = "11px sans-serif";
      ctx.strokeText(s.spread, lx, ly);
      ctx.fillStyle = "#9fb0c8";
      ctx.fillText(s.spread, lx, ly);
    });
  }

  // Hit test in SCREEN space so the radius stays a constant ~9px at any zoom.
  function nearestNode(mx, my) {
    var best = null, bestD = HIT_RADIUS * HIT_RADIUS;
    var filtering = anyFilterActive();
    for (var i = 0; i < graph.nodes.length; i++) {
      // BRAINMAP-FILTER: hover/click only apply to visible (active) nodes.
      if (filtering && !isActive(graph.nodes[i])) continue;
      var dx = toScreenX(positions[i].px) - mx, dy = toScreenY(positions[i].py) - my;
      var d = dx * dx + dy * dy;
      if (d <= bestD) { bestD = d; best = graph.nodes[i]; }
    }
    return best;
  }

  function onMove(ev) {
    // BRAINMAP-ATMOSPHERE: while nodes are still travelling, hover would
    // tooltip a node that is not yet where the pointer is — suppress it.
    // (A passing mouse does NOT skip the intro; deliberate input does.)
    if (intro.active) return;
    var rect = canvas.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    if (isDragging) {
      var ddx = ev.clientX - dragStartX, ddy = ev.clientY - dragStartY;

      tooltip.style.display = "none";

        // anchor (arcStart/rotAtPress), never accumulated frame to frame —
        // that is what makes it exactly reversible: returning the cursor to
        // the press point makes the delta the identity, restoring the
        // orientation bit for bit.
        applyArcball(mx, my);
        return;

      // genuine click (below threshold) still navigates to the card.

      view.offsetY = startOffsetY + ddy;
      draw();
      return;

    if (n.cluster_id !== null && n.cluster_id !== undefined && clusterById[n.cluster_id]) {

        // BRAINMAP-FOCUS: the modifier is discoverable at the moment of use.
        (focusCluster === null ? " · Shift+클릭: 이 묶음만 보기" : "") + "</div>";
    }

    tooltip.style.display = "block";

    tooltip.style.left = Math.max(4, tx) + "px";
    tooltip.style.top = (my + 14) + "px";
  }

  function onDown(ev) {
    skipIntro(); cancelCamera();
    isDragging = true;
    // BRAINMAP-3D-CONTROLS: in 3D a plain LEFT drag rotates; RIGHT-drag and
    // Shift+drag pan (two ways to reach the same thing). The Shift+CLICK
    // focus gesture is untouched — it fires only under CLICK_MOVE_THRESHOLD,
    // exactly as in 2D. In 2D `dragRotating` is always false, so the entire
    // 2D drag path below is byte-identical to before.
    // BRAINMAP-3D-DEPTH (Part C): a press on the BACKGROUND — outside the
    // cloud's own projected edge — pans instead of rotating. That is the
    // gesture the map was missing when zoomed out, where most of the canvas is
    // background (81.4% of it at the default view, 39.2% at 2x, 0% at 4x).
    // Right-drag / Shift+drag still pan from anywhere, which is what keeps pan
    // reachable once the cloud fills the canvas and no background is left.
    var r0 = canvas.getBoundingClientRect();

    var onBackground = pressOutsideCloud(ev.clientX - r0.left, ev.clientY - r0.top);

      arcStart = sphereVec(ev.clientX - r0.left, ev.clientY - r0.top);
      rotAtPress = rotM.slice();
    } else {
      arcStart = null; rotAtPress = null;
    }

    startOffsetX = view.offsetX; startOffsetY = view.offsetY;
    dragDist = 0;

  }

  function onUp() {
    if (isDragging) {
      isDragging = false;
      if (dragRotating) {

        // rebuilt from the press anchor, so reversibility stays exact.
        rotM = _mat3Orthonormalize(rotM);
        dragRotating = false;
        arcStart = null; rotAtPress = null;
      }
      canvas.style.cursor = "grab";
    }
  }

  // BRAINMAP-3D-CONTROLS: arcball step (mouse + one-finger touch share it).
  // Rotation is the reader's camera, never data; relayout recomputes the
  // projection + paint order (the depth sort runs only on these frames).
  function applyArcball(mx, my) {
    if (!arcStart || !rotAtPress) return;
    rotM = _mat3Mul(rotBetween(arcStart, sphereVec(mx, my)), rotAtPress);
    layout();
    draw();
  }

  // Zoom by `factor`, anchored so the world point under the screen point (mx,my)
  // stays fixed. Extracted from onWheel unchanged (MOBILE-POLISH H) so the wheel
  // and the pinch below drive scale through the SAME math — the only difference is
  // where the anchor comes from (cursor vs pinch midpoint) and how the factor is
  // derived (wheel direction vs finger-distance ratio).
  function zoomAt(mx, my, factor) {
    var wx = (mx - view.offsetX) / view.scale;
    var wy = (my - view.offsetY) / view.scale;

  }

  function centerOnNode(n) {
    var rect = canvas.parentElement.getBoundingClientRect();
    var fw = Math.max(320, rect.width), fh = Math.max(280, rect.height);
    var fp = positions[n._i];
    hoverNode = n;
    tooltip.style.display = "none";
    // BRAINMAP-ATMOSPHERE: glide to the target instead of jumping. Same
    // destination as before (scale 2.5, node centred) — only the transition.
    animateViewTo(2.5, fw / 2 - fp.px * 2.5, fh / 2 - fp.py * 2.5);
  }

  // BRAINMAP-FEATURES: search input — lightly debounced; ENTER jumps to the
  // first node passing ALL active conditions. Clearing restores per the other
  // active filters (domain/spread stay in force).
  var searchDebounce = null;
  function onSearchInput(ev) {
    skipIntro();
    var q = String(ev.target.value || "").trim().toLowerCase();
    if (searchDebounce) clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () {
      // BRAINMAP-3D-DEPTH (Part A1): a new query invalidates the remembered
      // match — only a match the reader actually jumped to is worth carrying.
      // BRAINMAP-SEARCH-NAV: a new query also resets the reader's position.
      if (q !== searchQuery) { searchMatchIndex = null; searchPos = -1; }
      searchQuery = q;
      hoverNode = null;
      tooltip.style.display = "none";
      updateSearchCount();
      draw();
    }, 120);
  }

  // BRAINMAP-SEARCH-NAV: keys bound INSIDE the search box —
  //   Enter / ArrowDown        -> next match (a NEW query lands on the first)
  //   Shift+Enter / ArrowUp    -> previous match
  //   Escape                   -> clear the query
  // Enter ADVANCES rather than always returning to the first, because pressing
  // it again is what a reader actually tries. Arrow keys are preventDefault'ed
  // so they step instead of moving the caret to the ends of the input.
  function onSearchKeydown(ev) {
    skipIntro();
    if (ev.key === "Escape") { ev.preventDefault(); clearSearch(); return; }
    var isNext = (ev.key === "Enter" && !ev.shiftKey) || ev.key === "ArrowDown";
    var isPrev = (ev.key === "Enter" && ev.shiftKey) || ev.key === "ArrowUp";
    if (!isNext && !isPrev) return;
    ev.preventDefault();
    // Apply any pending debounced value immediately, then step.
    var prevQuery = searchQuery;
    if (searchDebounce) { clearTimeout(searchDebounce); searchDebounce = null; }
    searchQuery = String(ev.target.value || "").trim().toLowerCase();
    // BRAINMAP-3D-DEPTH (Part A1): searchMatchIndex remembers WHICH node the
    // search centred on, so a mode switch can re-centre it in the other layout;
    // a changed query invalidates it (and the reader's position with it).
    if (searchQuery !== prevQuery) { searchMatchIndex = null; searchPos = -1; }
    if (!searchQuery) { updateSearchCount(); draw(); return; }
    stepMatch(isPrev ? -1 : 1);
  }

  // BRAINMAP-FEATURES: spread-size dropdown (cluster outlet_count threshold).
  function onSpreadChange(ev) {
    skipIntro();
    spreadMin = Number(ev.target.value) || 0;
    hoverNode = null;
    tooltip.style.display = "none";
    updateSearchCount();
    draw();
  }

  // BRAINMAP-FEATURES: one-pass FULL-graph stats (never the filtered view):
  // 노드/연결(edges)/클러스터 counts + connected-vs-isolated by the has-an-edge
  // definition, + largest cluster's outlet count. Circulation vocabulary only.
  function renderStats() {
    var el = document.getElementById("mapStats");
    if (!el) return;
    var connected = 0;
    graph.nodes.forEach(function (n) { if (hasEdgeById[n.id]) connected += 1; });
    var isolated = graph.nodes.length - connected;
    var maxOutlets = 0;
    (graph.clusters || []).forEach(function (c) {
      if (c.outlet_count > maxOutlets) maxOutlets = c.outlet_count;
    });
    el.textContent = "노드 " + graph.nodes.length + "개 · 연결 " + graph.edges.length
      + "개 · 클러스터 " + (graph.clusters || []).length
      + "개 · 연결된 노드 " + connected + "개 · 미연결 " + isolated + "개"
      + (maxOutlets > 0 ? " · 최대 확산 " + maxOutlets.toLocaleString("ko-KR") + "개 매체" : "");
  }

  function onClick(ev) {
    skipIntro();
    // A drag past the threshold was a pan, not a click — do not navigate.
    if (dragDist > CLICK_MOVE_THRESHOLD) { dragDist = 0; return; }
    var rect = canvas.getBoundingClientRect();
    var n = nearestNode(ev.clientX - rect.left, ev.clientY - rect.top);
    if (!n) return;
    // BRAINMAP-FOCUS: a MODIFIED click (or an armed one-shot tap) focuses the
    // node's cluster; a plain click still opens the card exactly as before, so
    // the card is no further away than it was.
    if (ev.shiftKey || ev.altKey || ev.metaKey || focusArmed) {
      setFocus(n);
      return;
    }
    if (n.id) window.location.href = "/?result_id=" + encodeURIComponent(n.id);
  }

  // BRAINMAP-FOCUS: focus one cluster. An UNCLUSTERED node (9,678 of them) has
  // no constellation to isolate, so focusing it would dim the entire map to a
  // single dot and read as "this one matters". We decline and say why instead —
  // having no cluster is the corpus's most common state, not an error.
  function setFocus(n) {
    var cid = (n && n.cluster_id !== null && n.cluster_id !== undefined)
      ? n.cluster_id : null;
    if (cid === null) {
      focusArmed = false;
      updateLegendActive();
      showFocusNote("이 점은 아직 다른 기사와 연결되지 않아 집중할 묶음이 없습니다.");
      return;
    }
    focusCluster = cid;
    focusArmed = false;   // one-shot: a plain tap opens cards again
    hoverNode = null;
    tooltip.style.display = "none";
    updateLegendActive();
    updateFocusChip();
    updateSearchCount();
    draw();
  }

  // `redraw` false when the caller repaints itself (legend click path).
  function clearFocus(redraw) {
    if (focusCluster === null && !focusArmed) return;
    focusCluster = null;
    focusArmed = false;
    updateLegendActive();
    updateFocusChip();
    updateSearchCount();
    if (redraw !== false) draw();
  }

  function showFocusNote(text) {
    var el = document.getElementById("focusChip");
    if (!el) return;
    el.textContent = text;
    el.style.display = "";
    el.disabled = true;
    if (focusNoteTimer) clearTimeout(focusNoteTimer);
    focusNoteTimer = setTimeout(function () { updateFocusChip(); }, 3200);
  }

  // BRAINMAP-3D-VIEW: gesture hint while 3D is on — rotation replaced the
  // plain drag, so say where pan went. Pure chrome, encodes nothing.
  function updateModeHint() {
    var el = document.getElementById("modeHint");
    if (!el) return;
    if (mode3d) {
      // BRAINMAP-3D-DEPTH (Part C): the cloud's own edge now splits rotate from
      // pan, so the hint says so in words. No ring is drawn on the canvas — the
      // visible edge of the cloud IS the boundary.
      el.textContent = "회전: 점 구름 안쪽 드래그 · 이동: 바깥쪽 드래그, "
        + "오른쪽 드래그/Shift+드래그, 두 손가락으로 밀기 · 확대: 휠/두 손가락 벌리기";
      el.style.display = "";
    } else {
      el.style.display = "none";
    }
  }

  function updateFocusChip() {
    var el = document.getElementById("focusChip");
    if (!el) return;
    if (focusNoteTimer) { clearTimeout(focusNoteTimer); focusNoteTimer = null; }
    el.disabled = false;
    if (focusCluster !== null) {
      var c = clusterById[focusCluster];
      // size_label is the builder's own circulation string ("N개 매체 보도 중").
      el.textContent = "집중 해제" + (c && c.size_label ? " · " + c.size_label : "");
      el.style.display = "";
    } else if (focusArmed) {
      el.textContent = "집중할 묶음을 탭하세요 · 취소";
      el.style.display = "";
    } else {
      el.style.display = "none";
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function start(data) {
    if (!data || data.empty === true || !data.nodes || data.nodes.length === 0) {
      statusEl.textContent = "지도가 아직 생성되지 않았습니다.";
      return;
    }
    graph = data;
    graph.nodes.forEach(function (n, i) { n._i = i; nodeById[n.id] = n; });
    // BRAINMAP-3D-VIEW: the comparison mode exists only when the builder
    // emitted 3D coordinates; older payloads simply never show the chip.
    has3d = graph.nodes.length > 0 && graph.nodes.every(function (n) {
      return typeof n.x3 === "number" && typeof n.y3 === "number"
        && typeof n.z3 === "number";
    });
    // BRAINMAP-3D-DEPTH (Part C): the cloud's boundary, computed ONCE in 3D
    // world space — the centroid of x3/y3/z3 plus the 99th percentile of the
    // distance to it. A radius in 3D is a rotation INVARIANT, and an
    // orthographic projection of a sphere is a circle of the same radius at
    // every orientation, so the boundary cannot jitter as the map turns.
    //   p99 rather than max: the outermost ~1% are stragglers, and a circle
    //   drawn to the last stray dot would be 12% wider than the cloud anyone
    //   can see (0.538 vs 0.479 units) while surrendering pannable background.
    if (has3d) {
      var c3x = 0, c3y = 0, c3z = 0, N3 = graph.nodes.length;
      graph.nodes.forEach(function (n) { c3x += n.x3; c3y += n.y3; c3z += n.z3; });
      c3x /= N3; c3y /= N3; c3z /= N3;
      var d3 = graph.nodes.map(function (n) {
        var dx = n.x3 - c3x, dy = n.y3 - c3y, dz = n.z3 - c3z;
        return Math.sqrt(dx * dx + dy * dy + dz * dz);
      }).sort(function (a, b) { return a - b; });
      cloud3 = { cx: c3x, cy: c3y, cz: c3z,
                 r: d3[Math.min(d3.length - 1, Math.floor(0.99 * (d3.length - 1)))] };
    }
    (graph.clusters || []).forEach(function (c) { clusterById[c.cluster_id] = c; });
    // BRAINMAP-3D-FREE-WINS (1/4): one pass over the nodes, at load, to give
    // each its sprite/alpha combo id. Everything the draw loop needs about a
    // node's appearance is decided here, once.
    buildNodeCombos();
    // BRAINMAP-FEATURES: has-an-edge index (drives the 연결됨 count + stats).
    graph.edges.forEach(function (e) {
      hasEdgeById[e.src] = true;
      hasEdgeById[e.dst] = true;
    });
    statusEl.style.display = "none";
    buildLegend(graph.nodes);
    renderStats();
    document.getElementById("legend").addEventListener("click", onLegendClick);
    // BRAINMAP-FEATURES: search + spread controls.
    var searchEl = document.getElementById("mapSearch");
    if (searchEl) {
      searchEl.addEventListener("input", onSearchInput);
      searchEl.addEventListener("keydown", onSearchKeydown);
    }
    // BRAINMAP-SEARCH-NAV: the visible stepper — the only route to match 2 on a
    // phone, which has neither an Enter key in view nor arrow keys.
    var prevMatchBtn = document.getElementById("searchPrev");
    var nextMatchBtn = document.getElementById("searchNext");
    if (prevMatchBtn) prevMatchBtn.addEventListener("click", function () { stepMatch(-1); });
    if (nextMatchBtn) nextMatchBtn.addEventListener("click", function () { stepMatch(1); });
    var spreadEl = document.getElementById("spreadFilter");
    if (spreadEl) spreadEl.addEventListener("change", onSpreadChange);
    layout();
    // BRAINMAP-ATMOSPHERE: arrive. Runs once per page load; a ?focus= deep
    // link (below) skips it so the linked node is centred immediately.
    runIntro();
    if (!intro.active) draw();
    canvas.style.cursor = "grab";
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mousedown", onDown);
    window.addEventListener("mouseup", onUp);
    canvas.addEventListener("mouseleave", function () {
      hoverNode = null; tooltip.style.display = "none"; draw();
    });
    canvas.addEventListener("click", onClick);
    canvas.addEventListener("wheel", onWheel, { passive: false });
    canvas.addEventListener("dblclick", resetView);
    // BRAINMAP-3D-CONTROLS: right-drag pans, so the context menu must not
    // interrupt it. Bound on the CANVAS ELEMENT ONLY (not document/window),
    // so right-click keeps working normally everywhere else on the page —
    // header, legend chips, links, the tooltip.
    canvas.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
    // MOBILE-POLISH H: touch pan/pinch. passive:false — every one of these calls
    // preventDefault on a real gesture, which a passive listener may not do.
    canvas.addEventListener("touchstart", onTouchStart, { passive: false });
    canvas.addEventListener("touchmove", onTouchMove, { passive: false });
    canvas.addEventListener("touchend", onTouchEnd, { passive: false });
    canvas.addEventListener("touchcancel", onTouchEnd, { passive: false });
    var resetBtn = document.getElementById("resetView");
    if (resetBtn) resetBtn.addEventListener("click", resetView);
    // BRAINMAP-FOCUS: the chip clears focus (or cancels a waiting arm).
    var focusBtn = document.getElementById("focusChip");
    if (focusBtn) focusBtn.addEventListener("click", function () { clearFocus(true); });
    // Escape releases focus, matching 리셋 / dblclick. Ignored while the search
    // box has the caret so Escape can still clear the query first.
    // BRAINMAP-SEARCH-NAV: Escape now clears the SEARCH too, from anywhere on
    // the page. Both duties run, independently — clearing a query never skips
    // the focus release, and with only a focus active the behaviour is exactly
    // what it was. Inside the box, onSearchKeydown owns Escape (it clears the
    // input's value as well), so this handler still defers to it there.
    window.addEventListener("keydown", function (ev) {
      // BRAINMAP-ATMOSPHERE: any keypress is deliberate input — settle now.
      skipIntro();
      if (ev.key !== "Escape") return;
      if (document.activeElement && document.activeElement.id === "mapSearch") return;
      if (searchQuery) clearSearch();
      if (focusCluster !== null || focusArmed) clearFocus(true);
    });
    // BRAINMAP-HOVER A8: ?focus=<result_id> (from the card's 브레인맵에서 유사
    // 보도 보기 link) lands centered + hovered on that card's node, reusing the
    // existing view/hoverNode/draw machinery. Node ids ARE result ids (see
    // onClick). Fail-silent when the id is absent or not in the graph (old
    // card / rebuilt graph) — the map just shows the default view.
    try {
      var focusId = new URLSearchParams(window.location.search).get("focus");
      var focusNode = focusId !== null ? nodeById[focusId] : null;
      if (focusNode) {
        // BRAINMAP-ATMOSPHERE: a deep link means "show me THIS node" — the
        // entry animation would delay that, so settle instantly instead.
        skipIntro();
        var rect = canvas.parentElement.getBoundingClientRect();
        var fw = Math.max(320, rect.width), fh = Math.max(280, rect.height);
        var fp = positions[focusNode._i];
        view.scale = 2.5;
        view.offsetX = fw / 2 - fp.px * view.scale;
        view.offsetY = fh / 2 - fp.py * view.scale;
        hoverNode = focusNode;
        draw();
        // Same tooltip markup onMove builds, anchored beside the centered node.
        var fspread = "";
        if (focusNode.cluster_id !== null && focusNode.cluster_id !== undefined && clusterById[focusNode.cluster_id]) {
          fspread = '<div class="tip-spread">' + clusterById[focusNode.cluster_id].size_label + "</div>";
        }
        tooltip.innerHTML = escapeHtml(focusNode.title || "(제목 없음)") + fspread;
        tooltip.style.display = "block";
        tooltip.style.left = Math.max(4, Math.min(fw / 2 + 14, fw - 330)) + "px";
        tooltip.style.top = (fh / 2 + 14) + "px";
      }
    } catch (e) { /* focus is optional — never break the map */ }
    // Resize: re-fit the world layer to the new viewport; preserve the
    // current pan/zoom transform on top (a sensible, non-jarring default).
    window.addEventListener("resize", function () { layout(); draw(); });
  }

  fetch("/api/brainmap")
    .then(function (r) {
      if (!r.ok) throw new Error("bad status " + r.status);
      return r.json();
    })
    .then(start)
    .catch(function () {
      statusEl.textContent = "지도를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
    });
})();
</script>
</body>
</html>
