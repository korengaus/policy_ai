<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 확산 리포트 — tickedin</title>
<!-- LINK-PREVIEW: OG/Twitter tags mirror frontend/template.html's set. Circulation
     vocabulary only (확산/매체) — no truth/falsity claim, no counts. Canonical URL
     has no query parameters (archive permalinks share one preview). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="tickedin">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://tickedin.org/web/weekly.html">
<meta property="og:title" content="주간 확산 리포트 — tickedin">
<meta property="og:description" content="한 주 동안 가장 많이 확산된 정책 주장을 매체 수 기준으로 보여주는 주간 확산 리포트. 확산 규모 기준이며 사실 검증이 아닙니다.">
<meta property="og:image" content="https://tickedin.org/web/assets/og-weekly.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="tickedin 주간 확산 리포트 — 확산 규모 기준 · 사실 검증 아님">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="주간 확산 리포트 — tickedin">
<meta name="twitter:description" content="한 주 동안 가장 많이 확산된 정책 주장을 매체 수 기준으로 보여주는 주간 확산 리포트. 확산 규모 기준이며 사실 검증이 아닙니다.">
<meta name="twitter:image" content="https://tickedin.org/web/assets/og-weekly.png">
<!--
  WEEKLY-REPORT Slice 2 — standalone, hand-authored page (NOT
  build_index-managed; touches none of the index pins — same precedent as
  web/brainmap.html). Fetches GET /api/weekly-report (the stored snapshot
  written by scripts/generate_weekly_report.py) and renders the Top-N
  most-amplified claims of the week. VERDICT-ISOLATED: ranking and display
  are CIRCULATION (distinct outlet count) only — no truth-probability, no
  verdict, no gauge, no red/green semantics. Each title links back to its
  verification card (/?result_id=N) where verification lives.
  Self-contained: inline CSS + JS, no external lib/CDN. Data is rendered via
  textContent (never innerHTML) so API strings are display-only.
-->
<style>
  /* Tokens mirrored from the main site's design system (same set as
     web/brainmap.html) so this standalone page reads as tickedin. */
  :root {
    /* 63-APPLY: token block synced to frontend/styles/main.css (the design
       system's 01/02/03/04 values). Old cool greys/blues replaced by the warm
       ink ramp + recalibrated accent; radius 0; system type stack. */
    --ink: #1e1e1b;
    --slate: #45453e;
    --muted: #6b6b62;
    --ink-400: #8a8a80;
    --line: #d9d8cf;
    --line-100: #e8e7e0;
    --line-300: #c0bfb4;
    --paper: #fbfbf9;
    --canvas: #f5f5f2;
    --well: #edece6;
    --tint: #e4e9f4;
    --brand: #1f4fa8;
    --brand-ink: #173e88;
    --shadow: 0 8px 24px -12px rgba(30, 30, 27, 0.25);
    --radius: 0;
    --radius-sm: 0;
    --font-sans: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100vh;
  }
  header.report-head {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px 20px;
  }
  .brand-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); text-decoration: none;
    /* 78-APPLY §07 T2: system sans 650, -0.01em (was Noto Serif KR 700). */
    font-family: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    font-size: 21px; font-weight: 650; letter-spacing: -0.01em;
  }
  .brand img { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: middle; }
  .brand-page-label {
    color: var(--muted); font-size: 13px; font-weight: 600;
    padding-left: 12px; border-left: 1px solid var(--line);
  }
  .report-home {
    margin-left: auto; font-size: 13px; font-weight: 600;
    color: var(--brand-ink); text-decoration: none;
  }
  .report-home:hover { text-decoration: underline; }
  .report-title {
    font-size: 24px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink);
    /* FONT-SWITCH: page title joins the body sans stack; only .brand stays serif. */
    font-family: var(--font-sans);
  }
  .report-week { margin-top: 4px; font-size: 13.5px; color: var(--slate); font-weight: 600; }
  /* SNAPSHOT-BASIS (105-APPLY): the figures below are FROZEN at generation
     (payload_json is written once and never re-rendered), and the only line
     that said so — "기준 시점: … 브레인맵 · … 집계" — sat in the footer under
     the archive list, where no reader meets it before the numbers. The same
     composition, plus the site's shipped 주간 스냅샷 기준 (home trending
     panel / hero eyebrow / claim timeline), now renders directly under the
     week range. Footer line unchanged; no number or ordering touched. */
  .report-basis { margin-top: 2px; font-size: 12.5px; color: var(--slate); }
  /* HONESTY (fixed, always visible): circulation ranking, NOT verification.
     QUIET-FRAMING (57-APPLY): was a brand-outlined pill — emphasis on a
     disclaimer made the denial read like a claim. Restyled to the main
     system's .reader-note treatment exactly (slate, 13px/1.55, no box);
     text verbatim, still a permanent always-visible block. */
  .report-framing {
    margin-top: 8px; display: block;
    color: var(--slate); font-size: 13px; line-height: 1.55;
  }
  .report-subtitle { margin-top: 8px; font-size: 13.5px; line-height: 1.55; color: var(--slate); }
  .report-subtitle strong { color: var(--ink); font-weight: 700; }
  main.report-body { max-width: 860px; margin: 0 auto; padding: 24px 20px 40px; }
  #status { color: var(--slate); font-size: 15px; text-align: center; padding: 48px 24px; }
  ol.top-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  /* ONE-SITE (44-APPLY): the home page's primary surfaces are hairline
     cards (1px --line, no shadow, 12px radius); the ranked items join
     that family — shadow dropped, radius-sm → --radius. */
  .top-item {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
  }
  .top-rank {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    /* ONE-SITE (57-APPLY) → 74-APPLY (B): the cool #eff6ff predates the token
       layer — the system's identity tint is --tint. */
    background: var(--tint); color: var(--brand-ink);
    font-weight: 800; font-size: 15px;
  }
  .top-main { flex: 1 1 auto; min-width: 0; }
  .top-title {
    color: var(--ink); text-decoration: none;
    font-size: 15.5px; font-weight: 700; line-height: 1.45;
    display: inline-block;
  }
  .top-title:hover { color: var(--brand-ink); text-decoration: underline; }
  .top-meta {
    margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px 12px;
    align-items: center; font-size: 13px; color: var(--slate);
  }
  .outlet-badge {
    display: inline-flex; align-items: center;
    background: var(--tint); color: var(--brand-ink);
    border-radius: 0; padding: 2px 8px;
    font-weight: 700; font-size: 12px;
  }
  /* CLAIM-LINK: sits in the meta row like the other spans; brand-ink link. */
  .claim-link { color: var(--brand-ink); text-decoration: none; font-weight: 700; }
  .claim-link:hover { text-decoration: underline; }
  /* WEEKLY-ARCHIVE: 지난 리포트 list — deliberately unnumbered plain links. */
  .archive-section { max-width: 860px; margin: 0 auto; padding: 4px 20px 28px; }
  .archive-title { font-size: 13.5px; font-weight: 700; color: var(--slate); margin-bottom: 8px; }
  .archive-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .archive-list a { color: var(--brand-ink); text-decoration: none; font-size: 13px; font-weight: 600; }
  .archive-list a:hover { text-decoration: underline; }
  footer.report-foot {
    max-width: 860px; margin: 0 auto; padding: 0 20px 48px;
    font-size: 13px; color: var(--muted); line-height: 1.7;
  }
  footer.report-foot a { color: var(--brand-ink); text-decoration: none; font-weight: 600; }
  footer.report-foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header class="report-head">
  <div class="brand-row">
    <a class="brand" href="/" aria-label="tickedin 홈으로"><img src="/web/assets/favicon-180.png" alt="" aria-hidden="true">tickedin</a>
    <span class="brand-page-label">주간 리포트</span>
    <a class="report-home" href="/">← 홈으로</a>
  </div>
  <!-- SORT-SCOPE-HONESTY: the list is the clusters that circulated THIS WEEK,
       but the ranking key is the ALL-TIME outlet_count (generate_weekly_report
       sorts on -outlet_count), so "이번 주 가장 많이 확산된" claimed a
       within-week ranking the sort never computed. The heading now names both
       scopes using the page's own words (전체 기간 / 매체 수). Sort unchanged. -->
  <div class="report-title">이번 주 확산된 정책 주장 (전체 기간 매체 수 순)</div>
  <div class="report-week" id="weekRange"></div>
  <!-- SNAPSHOT-BASIS (105-APPLY): filled by render() from the stored
       graph_generated_at / generated_at — the same values the footer shows. -->
  <div class="report-basis" id="basis"></div>
  <div class="report-framing" id="framing">확산 규모 기준 · 사실 검증 아님</div>
  <p class="report-subtitle">
    이 목록은 여러 매체가 <strong>유사하게 보도한 규모</strong> 순입니다.
    <strong>사실 여부에 대한 판단이 아닙니다.</strong>
    제목을 누르면 해당 주장의 검증 카드로 이동합니다.
  </p>
  <!-- NEAR-ANCHOR-LABEL-HONESTY: the stored near_anchor_outlet_count includes the
       anchor's own outlet (build_brainmap_graph.py sim=1.0 self-pass), so the page
       subtracts the 첫 보도 at DISPLAY time. Legend states the exclusion.
       Circulation vocabulary only. -->
  <p class="report-subtitle report-note">
    <strong>문구 거의 동일</strong> = 첫 보도를 제외하고, 첫 보도와 제목·주장 문구가 거의 같은 매체 수입니다.
    전체 확산 매체 수와는 별개이며, 사실 여부 판단이 아닙니다.
  </p>
</header>
<main class="report-body">
  <div id="status">리포트를 불러오는 중…</div>
  <ol class="top-list" id="topList"></ol>
</main>
<!-- WEEKLY-ARCHIVE: filled by JS only when archived weeks exist — an empty
     archive renders nothing here, never fabricated history. -->
<section class="archive-section" id="archive"></section>
<footer class="report-foot" id="foot"></footer>
<script>
(function () {
  "use strict";

  function day(iso) {
    return (typeof iso === "string" && iso.length >= 10) ? iso.slice(0, 10) : "";
  }
  // TITLE-BRACKET-STRIP (DISPLAY ONLY): titles that LEAD with a bracketed
  // format marker ([포토] [속보] [금융 HOT 뉴스]) carry a broadcast/wire tag,
  // not content. Same mechanical rule and same regex as web/claim.html's
  // CLAIM-TITLE: eligibility is purely "starts with [ … ]" — never outlet,
  // reliability or verdict, which would be an editorial judgement. Applied to
  // the STRING RENDERED only; the stored label_title in the snapshot is
  // untouched, and ranking, counts and links are unaffected. A title that is
  // NOTHING but a marker keeps its stored text (never render an empty title).
  var BRACKET_LEAD = /^\s*\[[^\]]{1,15}\]\s*/;
  function displayTitle(title) {
    if (typeof title !== "string") return "";
    return title.replace(BRACKET_LEAD, "").trim() || title;
  }
  // WEEKLY-PAGE-ENRICH: honest spread-SPEED = the first->last SPAN duration only
  // (we have first/last timestamps, NOT a per-outlet arrival curve, so never a
  // "M개 매체 in N시간" rate). "" when either timestamp is missing/unparseable so
  // the caller omits the span; "당일" when the span rounds to <1h.
  function spreadSpeed(firstIso, lastIso) {
    var a = Date.parse(firstIso), b = Date.parse(lastIso);
    if (isNaN(a) || isNaN(b) || b < a) return "";
    var hours = (b - a) / 3600000;
    if (hours < 1) return "확산 속도: 당일";
    if (hours < 24) return "확산 속도: 약 " + Math.round(hours) + "시간";
    return "확산 속도: 약 " + Math.round(hours / 24) + "일";
  }
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  // WEEKLY-ARCHIVE: stable per-week permalink. ?week=YYYY-MM-DD fetches that
  // archived snapshot via the EXISTING /api/weekly-report/{week_start} route
  // and renders it through the same render(report) below (no renderer fork).
  // Absent/malformed -> latest, unchanged. A week with no stored row renders
  // the empty posture — never a fabricated report.
  var weekParam = new URLSearchParams(location.search).get("week") || "";
  if (!/^\d{4}-\d{2}-\d{2}$/.test(weekParam)) weekParam = "";

  // CLAIM-LINK: per-entry link to the claim page (/web/claim.html?id=<lineage>).
  // Only the DURABLE lineage id is ever linked — the snapshot-time stable_id is
  // a membership hash that churns as clusters grow and is deliberately never
  // used here (it would mint dead links). Rows stored before the generator
  // carried lineage_id resolve it lazily from representative_analysis_id via
  // the EXISTING GET /api/topic-timeline/{id}; entries render immediately and
  // the link appears when resolution lands. Any failure/non-found/hung request
  // simply never appends — the near_anchor omission precedent: no dead link,
  // no placeholder, no layout gap, and one entry's failure never affects the
  // rest. Wording is circulation vocabulary and names the destination as the
  // FULL record: the weekly entry shows ONE week's window while the claim page
  // shows every member to date, so the two counts can differ legitimately.
  var CLAIM_LINK_TEXT = "이 주장 전체 확산 기록 →";
  function appendClaimLink(meta, item) {
    function append(lineage) {
      if (typeof lineage !== "string" || !lineage.trim()) return;
      var a = el("a", "claim-link", CLAIM_LINK_TEXT);
      a.href = "/web/claim.html?id=" + encodeURIComponent(lineage.trim());
      meta.appendChild(a);
    }
    if (typeof item.lineage_id === "string" && item.lineage_id.trim()) {
      append(item.lineage_id);
      return;
    }
    var rid = Number(item.representative_analysis_id);
    if (!(rid > 0)) return;
    fetch("/api/topic-timeline/" + encodeURIComponent(rid))
      .then(function (response) { return response.ok ? response.json() : null; })
      .then(function (data) {
        if (data && data.found === true) append(data.lineage_id);
      })
      .catch(function () {});
  }

  // WEEKLY-ARCHIVE-SELF-EXCLUDE: 지난 리포트 is PAST reports, but the weeks
  // endpoint returns every stored week including the one on screen, so the
  // current week linked to itself; re-runs can also store the same
  // (week_start, week_end) twice. Both are handled at RENDER time only — no
  // date is altered, nothing is added, the API payload is untouched. The
  // report fetch and the weeks fetch race, so the archive paints once BOTH
  // the weeks list and the displayed week are known. "Known" includes the
  // failure paths: a missing/empty report still shows the archive, just
  // without a self to exclude.
  var archiveWeeks = null;
  var displayedWeek = weekParam;      // a ?week= permalink knows its week up front
  var reportSettled = !!weekParam;
  var archivePainted = false;

  function renderArchive() {
    if (archivePainted || !archiveWeeks || !reportSettled) return;
    var section = document.getElementById("archive");
    if (!section) return;
    var seen = {};
    var rows = [];
    archiveWeeks.forEach(function (week) {
      var start = day(week.week_start);
      var end = day(week.week_end);
      if (!start) return;
      if (displayedWeek && start === displayedWeek) return;  // the week on screen
      var key = start + "|" + end;
      if (seen[key]) return;                                 // duplicate pair
      seen[key] = true;
      rows.push({ start: start, end: end });
    });
    if (!rows.length) return;
    archivePainted = true;
    section.appendChild(el("div", "archive-title", "지난 리포트"));
    var listNode = el("ul", "archive-list");
    rows.forEach(function (row) {
      var item = el("li");
      var link = el("a", null, row.end ? row.start + " ~ " + row.end : row.start);
      link.href = "/web/weekly.html?week=" + encodeURIComponent(row.start);
      item.appendChild(link);
      listNode.appendChild(item);
    });
    section.appendChild(listNode);
  }

  function showEmpty() {
    document.getElementById("status").textContent = weekParam
      ? "해당 주간의 리포트가 없습니다."
      : "이번 주 리포트가 아직 준비되지 않았습니다.";
    reportSettled = true;
    renderArchive();
  }

  function render(report) {
    var status = document.getElementById("status");
    var list = document.getElementById("topList");
    var top = Array.isArray(report.top) ? report.top : [];
    if (!top.length) { showEmpty(); return; }

    document.getElementById("weekRange").textContent =
      day(report.week_start) + " ~ " + day(report.week_end);
    // SNAPSHOT-BASIS (105-APPLY): where the reader meets the figures, say
    // what they are fixed to. 주간 스냅샷 기준 is the shipped home/claim
    // vocabulary for "from the weekly snapshot"; the 기준 시점 composition is
    // the footer's own line, verbatim, built from the same stored dates.
    // Parts render only when their date exists (old rows), never dangling.
    var basisParts = ["주간 스냅샷 기준"];
    var graphDay = day(report.graph_generated_at), genDay = day(report.generated_at);
    if (graphDay && genDay) {
      basisParts.push("기준 시점: " + graphDay + " 브레인맵 · " + genDay + " 집계");
    } else if (graphDay) {
      basisParts.push("기준 시점: " + graphDay + " 브레인맵");
    } else if (genDay) {
      basisParts.push("기준 시점: " + genDay + " 집계");
    }
    document.getElementById("basis").textContent = basisParts.join(" · ");
    // WEEKLY-ARCHIVE-SELF-EXCLUDE: the latest view learns its own week here.
    displayedWeek = day(report.week_start) || displayedWeek;
    reportSettled = true;
    renderArchive();
    // Mandatory honesty framing — the stored string, verbatim (the chip's
    // hardcoded default stays when the payload lacks it).
    if (report.framing) {
      document.getElementById("framing").textContent = report.framing;
    }

    top.forEach(function (item) {
      var li = el("li", "top-item");
      li.appendChild(el("span", "top-rank", item.rank));

      var main = el("div", "top-main");
      var link = el("a", "top-title", displayTitle(item.title) || "(제목 없음)");
      var rid = Number(item.representative_analysis_id);
      link.href = rid > 0 ? "/?result_id=" + encodeURIComponent(rid) : "/";
      main.appendChild(link);

      var meta = el("div", "top-meta");
      // WINDOW-LABELS: outlet_count is ALL-TIME (graph-level) while the span
      // beside it is usually THIS WEEK's window — unlabelled, "78개 매체 ·
      // 확산 기간 07-20 → 07-20" read as 78 outlets in one day. Each number
      // keeps its exact value; only the scope becomes visible. "전체 기간" is
      // composed from this page's own words (전체 확산 매체 수 / 확산 기간);
      // the window prefix reuses the EXISTING 이번 주/해당 주간 strings the
      // 보도 count line already renders.
      var outlets = Number(item.outlet_count);
      if (outlets > 0) meta.appendChild(el("span", "outlet-badge", outlets.toLocaleString("ko-KR") + "개 매체 (전체 기간)"));
      var winFrom = day(item.window_first_at), winTo = day(item.window_last_at);
      var from = winFrom || day(item.first_at);
      var to = winTo || day(item.last_at);
      // Old report rows without window_* fields fall back to the ALL-TIME
      // span — label them 전체 기간, never 이번 주, so the prefix cannot lie.
      var spanScope = (winFrom && winTo)
        ? (weekParam ? "해당 주간 " : "이번 주 ")
        : "전체 기간 ";
      if (from && to) meta.appendChild(el("span", null, spanScope + "확산 기간 " + from + " → " + to));
      if (Number(item.window_member_count) > 0) {
        // ARCHIVE-LABEL: on a past-week permalink (?week=...) "이번 주" is wrong —
        // reuse the "해당 주간" vocabulary already used by showEmpty above. The
        // latest view (no ?week) renders the exact same string as before.
        meta.appendChild(el("span", null, (weekParam ? "해당 주간 보도 " : "이번 주 보도 ") + Number(item.window_member_count).toLocaleString("ko-KR") + "건"));
      }
      // WEEKLY-ALLTIME-COUNT: member_count is the cluster's ALL-TIME article
      // count and was stored-but-unrendered (generate_weekly_report.py:194).
      // It sits directly beside the window count so the pair reads as one
      // distribution fact — "N건 of the all-time M건 landed in this window" —
      // and NEVER as importance. The scope prefix is this page's own existing
      // vocabulary: 전체 기간 exactly as the outlet badge and the span scope
      // above use it, 보도 N건 exactly as the window line renders it. It stays
      // 전체 기간 on an archived permalink too (weekParam is deliberately NOT
      // consulted — all-time is all-time, so 해당 주간 would be a lie).
      // Rendered whenever positive, including when it EQUALS the window count:
      // "all of this cluster's coverage fell inside the window" is itself the
      // honest reading, and a conditional would leave gaps down the column.
      // Stored value untouched; no existing number is read differently.
      if (Number(item.member_count) > 0) {
        meta.appendChild(el("span", null, "전체 기간 보도 " + Number(item.member_count).toLocaleString("ko-KR") + "건"));
      }
      // WEEKLY-PAGE-ENRICH: spread-speed span (first->last duration). Omitted when
      // the timestamps are missing/equal (spreadSpeed returns "").
      var speed = spreadSpeed(item.window_first_at || item.first_at,
                              item.window_last_at || item.last_at);
      if (speed) meta.appendChild(el("span", null, speed));
      // NEAR-ANCHOR-LABEL-HONESTY: the stored count includes the anchor's own
      // outlet, so the DISPLAYED value excludes the 첫 보도 (max(0, stored-1)).
      // 0 renders on purpose — "spreads widely but phrasing differs per outlet"
      // is the honest reading. ABSENT/null/non-finite (old report rows) still
      // hides the span entirely (never renders 0 for missing data). Stored
      // value untouched. Circulation measurement, not a verdict.
      var nearSame = item.near_anchor_outlet_count;
      if (typeof nearSame === "number" && isFinite(nearSame) && nearSame >= 0) {
        var nearShown = Math.max(0, nearSame - 1);
        meta.appendChild(el("span", null, "문구 거의 동일: " + nearShown.toLocaleString("ko-KR") + "개 매체"));
      }
      // CLAIM-LINK: appended lazily once a lineage id is in hand (see helper).
      appendClaimLink(meta, item);
      main.appendChild(meta);

      li.appendChild(main);
      list.appendChild(li);
    });
    status.style.display = "none";

    var foot = document.getElementById("foot");
    // STAMP-DATE-ONLY: these were raw machine timestamps ("2026-07-26 19:18
    // UTC") — a wall-clock time in a foreign timezone is noise to a Korean
    // reader and read as more precision than the daily job carries. Reuse the
    // page's own day() formatter: date only, no time, no UTC suffix. Same
    // stored values, only fewer characters of them shown.
    foot.appendChild(el("div", null,
      "기준 시점: " + day(report.graph_generated_at) + " 브레인맵 · "
      + day(report.generated_at) + " 집계"));
    var mapLine = el("div");
    var mapLink = el("a");
    // NAV-ICON-EVERYWHERE: the #ic-network signature leads the brainmap entrance link.
    // This standalone page has no shared sprite, so the symbol is inlined (static,
    // trusted markup). Geometry matches frontend/template.html's <symbol id="ic-network">.
    mapLink.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M10.5 10.7 6.5 7.3"/><path d="M13.6 10.8 17.4 8.2"/><path d="M12 14v4"/><path d="M7 6.1 17 6.9"/><circle cx="12" cy="12" r="2.1"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="12" cy="20" r="2"/></svg>뉴스 연결지도에서 확산 구조 보기 →';
    mapLink.href = "/web/brainmap.html";
    mapLine.appendChild(mapLink);
    foot.appendChild(mapLine);
  }

  // WEEKLY-ARCHIVE: past-week view — the static "이번 주" heading would be
  // wrong for an archived week, so it drops to the same phrase minus 이번 주,
  // and a back-link to the latest report is added (existing label styles
  // reused; weekRange still shows the actual date range via render()).
  if (weekParam) {
    document.querySelector(".report-title").textContent =
      "해당 주간 확산된 정책 주장 (전체 기간 매체 수 순)";
    var backLine = el("p", "report-subtitle");
    var backStrong = el("strong", null, "지난 리포트");
    var backLink = el("a", "report-home", "최신 리포트 보기 →");
    backLink.href = "/web/weekly.html";
    backLine.appendChild(backStrong);
    backLine.appendChild(document.createTextNode(" · "));
    backLine.appendChild(backLink);
    document.querySelector("header.report-head").appendChild(backLine);
  }

  fetch(weekParam
      ? "/api/weekly-report/" + encodeURIComponent(weekParam)
      : "/api/weekly-report")
    .then(function (response) {
      if (!response.ok) throw new Error("http " + response.status);
      return response.json();
    })
    .then(function (data) {
      if (!data || data.found !== true || !data.report) { showEmpty(); return; }
      render(data.report);
    })
    .catch(function () { showEmpty(); });

  // WEEKLY-ARCHIVE: 지난 리포트 list — one entry per archived week, the ACTUAL
  // date range always shown, deliberately UNNUMBERED (no 1주차/2주차: the two
  // earliest archived ranges overlap because they predate the weekly cron, and
  // explicit ranges keep that visible instead of implying a consecutive,
  // complete series). No total count, nothing summed across weeks. An empty
  // archive renders nothing. Rendered on both the latest and past-week views.
  fetch("/api/weekly-report-weeks")
    .then(function (response) {
      return response.ok ? response.json() : null;
    })
    .then(function (data) {
      archiveWeeks = (data && Array.isArray(data.weeks)) ? data.weeks : [];
      renderArchive();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
